<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Code Chat Viewer</title>
    <meta
      name="description"
      content="Offline HTML viewer for Claude Code JSONL session transcripts. Six UI languages, light/dark theme, no backend, no CDN."
    />
    <meta
      name="keywords"
      content="claude code, claude, anthropic, jsonl, transcript viewer, chat log, log viewer, single file html"
    />
    <meta property="og:title" content="Claude Code Chat Viewer" />
    <meta
      property="og:description"
      content="Offline HTML viewer for Claude Code JSONL session transcripts."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script src="lib/marked.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --bg-2: #171c23;
        --bg-3: #202732;
        --border: #2a3340;
        --text: #d4d8de;
        --muted: #7a8494;
        --accent: #5fa8ff;
        --c-user: #5fa8ff;
        --c-assistant: #7ed39a;
        --c-thinking: #b892e0;
        --c-tool: #e0b467;
        --c-result: #7ac4e0;
        --c-meta: #d8b36a;
        --c-system: #7a8494;
        --c-error: #ff6b6b;
        --c-hook: #e08fb4;
        --pre-bg: #0b0f14;
        --code-bg: rgba(120, 140, 170, 0.15);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #ffffff;
        --bg-2: #f7f8fa;
        --bg-3: #edf0f4;
        --border: #d9dde3;
        --text: #1b1f24;
        --muted: #6b7280;
        --accent: #2563eb;
        --c-user: #2563eb;
        --c-assistant: #16a34a;
        --c-thinking: #7c3aed;
        --c-tool: #b45309;
        --c-result: #0891b2;
        --c-meta: #ca8a04;
        --c-system: #6b7280;
        --c-error: #dc2626;
        --c-hook: #be185d;
        --pre-bg: #f3f4f7;
        --code-bg: rgba(50, 60, 80, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.55 -apple-system,
          "Segoe UI",
          Roboto,
          Ubuntu,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--bg-2);
        border-bottom: 1px solid var(--border);
        padding: 12px 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      header input[type="file"],
      header select,
      header button {
        color: var(--text);
        background: var(--bg-3);
        border: 1px solid var(--border);
        padding: 6px 10px;
        border-radius: 6px;
        font: inherit;
      }
      header button {
        cursor: pointer;
      }
      header button:hover,
      header select:hover {
        border-color: var(--accent);
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        font-size: 13px;
        color: var(--muted);
      }
      .filters label {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .filters input {
        margin-inline-end: 4px;
        vertical-align: middle;
      }
      .filters .base {
        color: var(--muted);
        opacity: 0.55;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
      }
      #stats {
        flex-basis: 100%;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
      }

      .e {
        display: grid;
        grid-template-columns: 3px 1fr;
        gap: 12px;
        padding: 6px 0;
        min-width: 0;
        content-visibility: auto;
        contain-intrinsic-size: auto 80px;
      }
      .e::before {
        content: "";
        background: var(--bar);
        border-radius: 2px;
      }
      .e > .body {
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .e .hdr {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .e .hdr .who {
        color: var(--bar);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-inline-end: 8px;
      }
      .e .hdr .tag {
        background: var(--bg-3);
        padding: 1px 6px;
        border-radius: 3px;
        margin-inline-end: 6px;
        font-size: 10px;
      }
      .e .hdr .copy-btn,
      .e .hdr .full-btn {
        all: unset;
        cursor: pointer;
        display: inline-block;
        padding: 2px 6px;
        margin-inline-start: 6px;
        border-radius: 4px;
        font-size: 12px;
        line-height: 1.2;
        opacity: 0.55;
        transition:
          opacity 0.12s,
          background 0.12s;
      }
      .e:hover .copy-btn,
      .e:hover .full-btn {
        opacity: 0.85;
      }
      .e .copy-btn:hover,
      .e .full-btn:hover {
        opacity: 1;
        background: var(--bg-3);
      }
      .e .copy-btn:focus-visible,
      .e .full-btn:focus-visible {
        opacity: 1;
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .e .copy-btn.copied {
        opacity: 1;
        color: var(--c-assistant);
        background: var(--bg-3);
      }

      .e.user {
        --bar: var(--c-user);
      }
      .e.assistant {
        --bar: var(--c-assistant);
      }
      .e.thinking {
        --bar: var(--c-thinking);
      }
      .e.tool-use {
        --bar: var(--c-tool);
      }
      .e.tool-result {
        --bar: var(--c-result);
      }
      .e.tool-result.error {
        --bar: var(--c-error);
      }
      .e.meta {
        --bar: var(--c-meta);
      }
      .e.system {
        --bar: var(--c-system);
      }
      .e.ui {
        --bar: var(--c-system);
        opacity: 0.7;
      }
      .e.task-note {
        --bar: var(--c-meta);
      }
      .e.hook {
        --bar: var(--c-hook);
      }
      .e.ask {
        --bar: var(--c-user);
      }
      .e.report {
        --bar: var(--c-thinking);
      }
      .e.system.error,
      .e.hook.error {
        --bar: var(--c-error);
      }
      .e.divider > .body {
        border-block-start: 1px dashed var(--c-system);
        padding-block-start: 6px;
      }
      .e .line {
        font-size: 12px;
        color: var(--muted);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      /* Full-text panel: one modal for any truncated entry; the feed keeps its heights. */
      #full-panel {
        width: min(1100px, 95vw);
        height: 90vh;
        max-width: none;
        max-height: none;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
      }
      #full-panel[open] {
        display: flex;
        flex-direction: column;
      }
      #full-panel::backdrop {
        background: rgba(0, 0, 0, 0.55);
      }
      .fp-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        border-block-end: 1px solid var(--border);
        background: var(--bg-2);
      }
      #fp-title {
        flex: 1 1 12em;
        min-width: 0;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fp-bar button {
        color: var(--text);
        background: var(--bg-3);
        border: 1px solid var(--border);
        padding: 4px 10px;
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .fp-bar button:hover:not(:disabled),
      .fp-bar button:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .fp-bar button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .fp-bar button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #fp-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 14px;
      }
      #fp-body > pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12.5px/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
      }

      .prose {
        font-size: 14px;
      }
      .prose p:first-child {
        margin-top: 0;
      }
      .prose p:last-child {
        margin-bottom: 0;
      }
      .prose pre {
        background: var(--pre-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        overflow-x: auto;
        font-size: 12.5px;
        line-height: 1.45;
        white-space: pre;
      }
      .prose code {
        background: var(--code-bg);
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 12.5px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .prose pre code {
        background: transparent;
        padding: 0;
      }
      .prose table {
        border-collapse: collapse;
        margin: 8px 0;
      }
      .prose th,
      .prose td {
        border: 1px solid var(--border);
        padding: 4px 10px;
      }
      .prose th {
        background: var(--bg-3);
      }
      .prose blockquote {
        border-inline-start: 3px solid var(--border);
        margin: 8px 0;
        padding-inline-start: 12px;
        color: var(--muted);
      }
      .prose a {
        color: var(--accent);
      }

      details.svc {
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg-2);
        min-width: 0;
        overflow: hidden;
      }
      details.svc > summary {
        padding: 4px 10px;
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
        user-select: none;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      details.svc[open] > summary {
        border-bottom: 1px solid var(--border);
      }
      details.svc > .content {
        padding: 8px 10px;
      }
      details.svc > .content > pre {
        margin: 0;
        background: var(--pre-bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        overflow-x: auto;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre;
      }
      details.svc > .content > pre code {
        background: transparent;
        padding: 0;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 60px 20px;
        font-size: 15px;
      }
      .kbd {
        background: var(--bg-3);
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 11px;
        font-family: ui-monospace, monospace;
        border: 1px solid var(--border);
      }
      .load-more {
        align-self: center;
        background: var(--bg-3);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        margin: 16px 0;
      }
      .load-more:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .demo-btn {
        background: var(--bg-3);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
      }
      .demo-btn:hover,
      .demo-btn:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
        outline: none;
      }

      body.drag-active #chat {
        outline: 3px dashed var(--accent);
        outline-offset: -8px;
        border-radius: 8px;
      }
      body.drag-active .empty {
        color: var(--accent);
      }

      /* Neutralized markdown image: no auto-fetch, just an inert label with URL */
      .att-imgs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-block-start: 8px;
      }
      .att-imgs img {
        max-width: 100%;
        max-block-size: 70vh;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .md-image {
        display: inline-block;
        color: var(--muted);
        font-style: italic;
      }
      .md-image-url {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.9em;
        opacity: 0.8;
      }

      main.hide-thinking .e.thinking {
        display: none;
      }
      main.hide-tools .e.tool-use {
        display: none;
      }
      main.hide-results .e.tool-result {
        display: none;
      }
      main.hide-system .e.system,
      main.hide-system .e.meta,
      main.hide-system .e.task-note {
        display: none;
      }
      main.hide-ui .e.ui {
        display: none;
      }
      main.hide-hooks .e.hook {
        display: none;
      }
      main.reader-mode .e:not(.user):not(.assistant):not(.divider) {
        display: none;
      }
      /* where the context was compacted stays visible in reader mode, whatever the filters */
      main.reader-mode .e.divider {
        display: grid;
      }
    </style>
  </head>
  <body>
    <header>
      <input type="file" id="file" accept=".jsonl,.json" />
      <div class="filters" id="filters">
        <label
          ><input type="checkbox" id="f-thinking" checked />
          <span class="f-label" data-k="thinking"></span
        ></label>
        <label
          ><input type="checkbox" id="f-tools" checked />
          <span class="f-label" data-k="tools"></span
        ></label>
        <label
          ><input type="checkbox" id="f-results" checked />
          <span class="f-label" data-k="results"></span
        ></label>
        <label
          ><input type="checkbox" id="f-system" /> <span class="f-label" data-k="system"></span
        ></label>
        <label
          ><input type="checkbox" id="f-hooks" /> <span class="f-label" data-k="hooks"></span
        ></label>
        <label><input type="checkbox" id="f-ui" /> <span class="f-label" data-k="ui"></span></label>
      </div>
      <label><input type="checkbox" id="reader-mode" /> <span id="reader-mode-label"></span></label>
      <select id="lang" title="Language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="zh">中文</option>
        <option value="ar">العربية</option>
      </select>
      <button id="theme" title="Theme"></button>
      <div id="stats"></div>
    </header>
    <main id="chat"><div class="empty" id="emptyState"></div></main>
    <dialog id="full-panel" aria-labelledby="fp-title">
      <div class="fp-bar">
        <span id="fp-title"></span>
        <button type="button" data-mode="text"></button>
        <button type="button" data-mode="md"></button>
        <button type="button" data-mode="json"></button>
        <button type="button" id="fp-copy"></button>
        <button type="button" id="fp-save"></button>
        <button type="button" id="fp-close"></button>
      </div>
      <div id="fp-body"></div>
    </dialog>

          persisted: (size, name) => `💾 ${size} محفوظ خارج السجل: ${name}`,

          tryExample: "جرّب مثالاً",
          filter: {

        },
      };
      const DATE_LOCALES = {
        en: "en-US",
        ru: "ru-RU",
        es: "es-ES",
        fr: "fr-FR",
        zh: "zh-CN",
        ar: "ar-EG",
      };

      // localStorage can throw in strict privacy modes / third-party iframe contexts.
      const storage = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch {
            return null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch {}
        },
      };

      const savedLang = storage.get("lang");
      const browserLang = (navigator.language || "en").toLowerCase().split("-")[0];
      let locale = savedLang || (I18N[browserLang] ? browserLang : "en");
      const L = () => I18N[locale];

      function applyLocale() {
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
      }

      // ===== theme =====
      function applyTheme(theme) {
        if (theme === "light") document.documentElement.dataset.theme = "light";
        else delete document.documentElement.dataset.theme;
        themeBtn.textContent = theme === "light" ? "🌙" : "☀️";
      }

      // Resolve the effective theme: explicit user choice wins; otherwise follow OS.
      function preferredTheme() {
        const saved = storage.get("theme");
        if (saved === "light" || saved === "dark") return saved;
        return window.matchMedia?.("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }

      // ===== DOM refs =====
      const chatEl = document.getElementById("chat");
      const statsEl = document.getElementById("stats");
      const fileEl = document.getElementById("file");
      const emptyEl = document.getElementById("emptyState");
      const langSel = document.getElementById("lang");
      const themeBtn = document.getElementById("theme");

      const FILTERS = ["thinking", "tools", "results", "system", "hooks", "ui"];
      const fbox = Object.fromEntries(FILTERS.map((k) => [k, document.getElementById("f-" + k)]));
      Object.values(fbox).forEach((el) => el.addEventListener("change", applyFilters));
      const readerBox = document.getElementById("reader-mode");
      const readerLabel = document.getElementById("reader-mode-label");
      readerBox.addEventListener("change", () => {
        chatEl.classList.toggle("reader-mode", readerBox.checked);
        storage.set("readerMode", readerBox.checked ? "1" : "");
      });

      // Privacy: neutralize markdown images (no auto-fetch) and restrict link schemes.
      // Without this, [text](...) and ![alt](...) in transcripts would fetch remote
      // resources on render and leak viewer usage to whoever crafted the transcript.
      const mdRenderer = new marked.Renderer();
      // marked sees esc()-ed text, so href/title arrive with our entities; undo them
      // before validating and escaping once — otherwise "&" in a URL became "&amp;".
      const unesc = (s) =>
        String(s ?? "")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/&amp;/g, "&");
      mdRenderer.image = function (href, title, text) {
        const alt = esc(unesc(text || "image"));
        const url = href ? ` <span class="md-image-url">${esc(unesc(href))}</span>` : "";
        return `<span class="md-image">🖼️ ${alt}${url}</span>`;
      };
      // Code is escaped by marked as well (block code in the renderer, inline code in the
      // tokenizer) — undo our layer(s) first so "&&" doesn't show as "&amp;&amp;".
      mdRenderer.code = function (code, infostring) {
        return marked.Renderer.prototype.code.call(this, unesc(code), infostring, false);
      };
      mdRenderer.codespan = function (text) {
        return `<code>${esc(unesc(unesc(text)))}</code>`;
      };
      mdRenderer.link = function (href, title, text) {
        // Only http(s) links are clickable; other schemes (javascript:, data:, file:, mailto:)
        // are rendered as plain text. `text` is already escaped/rendered by marked.
        const url = unesc(href);
        if (!url || !/^https?:\/\//i.test(url)) return text;
        const t = title ? ` title="${esc(unesc(title))}"` : "";
        return `<a href="${esc(url)}" rel="noopener noreferrer nofollow" target="_blank"${t}>${text}</a>`;
      };
      marked.setOptions({ renderer: mdRenderer, breaks: true, gfm: true });

      // ===== truncation =====
      const MAX_PROSE = 20_000;
      const MAX_SVC = 5_000;
      const cut = (s, max) =>
        !s ? "" : s.length <= max ? s : s.slice(0, max) + `\n\n… [${L().cut(s.length - max)}]`;
      const trunc = (s) => cut(s, MAX_PROSE);
      const truncSvc = (s) => cut(s, MAX_SVC);

      // ===== escaping & markdown =====
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const fmtTime = (iso) => {
        if (!iso || (typeof iso !== "string" && typeof iso !== "number")) return "";
        const d = new Date(iso);
        return isNaN(d.getTime()) ? "" : d.toLocaleString(DATE_LOCALES[locale], { hour12: false });
      };
      // XSS-safe: pre-escape HTML entities so marked only sees plain text with markdown syntax.
      // No raw HTML can reach innerHTML — no need for DOMPurify.
      // marked can overflow its stack on pathological input (thousands of nested list
      // markers) — fall back to escaped plain text so the entry keeps its place.
      const md = (txt) => {
        try {
          return marked.parse(esc(txt || ""));
        } catch {
          return `<pre>${esc(txt || "")}</pre>`;
        }
      };
      const preview = (s, n = 100) => {
        const p = s.slice(0, n).replace(/\s+/g, " ").trim();
        return esc(p) + (s.length > n ? "…" : "");
      };

      // ===== file loading =====
      async function loadFile(f) {
        // Clear stale stats from a previous file — on error the old stats row
        // would otherwise stay above the new error message and mislead the user.
        statsEl.textContent = "";
        chatEl.innerHTML = `<div class="empty">${L().reading}</div>`;
        try {
          const tri = await parseFile(f);
          render(tri.rows, f.name, tri);
        } catch (err) {
          chatEl.innerHTML = `<div class="empty">${L().errRead} ${esc(err.message)}</div>`;
        }
      }

      fileEl.addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (f) loadFile(f);
      });

      // ===== drag & drop =====
      // Enter-counter pattern: dragleave bubbles from children, so tracking a depth
      // counter avoids flickering the active class when hovering over nested elements.
      let dragDepth = 0;
      const hasFiles = (e) => e.dataTransfer?.types?.includes("Files");

      document.addEventListener("dragenter", (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        dragDepth++;
        document.body.classList.add("drag-active");
      });

      document.addEventListener("dragover", (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      });

      document.addEventListener("dragleave", (e) => {
        if (!hasFiles(e)) return;
        dragDepth--;
        if (dragDepth <= 0) {
          dragDepth = 0;
          document.body.classList.remove("drag-active");
        }
      });

      document.addEventListener("drop", async (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        dragDepth = 0;
        document.body.classList.remove("drag-active");

        // Copy items synchronously — DataTransferItemList goes dead after the handler.
        const items = Array.from(e.dataTransfer.items || []);
        const hasFolder = items.some((it) => it.webkitGetAsEntry?.()?.isDirectory);
        if (hasFolder) {
          chatEl.innerHTML = `<div class="empty">${L().dropFolderHint}</div>`;
          return;
        }

        const files = e.dataTransfer.files;
        if (!files.length) return;
        if (files.length > 1)
          console.warn(`Multiple files dropped; using first (${files[0].name})`);
        loadFile(files[0]);
      });

      // ===== triage =====
      // Line/record filtering and file-wide stats shared by every loader. DOM-free on
      // purpose: test/triage.test.mjs runs this section in Node, and the v0.2 indexer
      // can call it from a worker unchanged.

      // api-request* records (CLI 2.1.300+) are per-call API snapshots — system prompt,
      // tool schemas, user paths — up to half the file and not part of the conversation.
      // They are dropped before JSON.parse; "type" is always the first key.
      const API_LOG_PREFIX = '{"type":"api-request';
      const utf8 = new TextEncoder();
      const utf8Size = (s) => utf8.encode(s).length;

      function newTriage() {
        return { rows: [], byUuid: new Map(), bad: 0, dups: 0, apiReq: 0, apiBytes: 0 };
      }

      function triageLine(tri, ln) {
        if (!ln.trim()) return;
        if (ln.startsWith(API_LOG_PREFIX)) {
          tri.apiReq++;
          tri.apiBytes += utf8Size(ln);
          return;
        }
        let r;
        try {
          r = JSON.parse(ln);
        } catch {
          tri.bad++;
          return;
        }
        triageRecord(tri, r, ln);
      }

      // src: the raw line, when there is one — only used to size dropped API records.
      function triageRecord(tri, r, src = null) {
        if (typeof r?.type === "string" && r.type.startsWith("api-request")) {
          tri.apiReq++;
          tri.apiBytes += utf8Size(src ?? JSON.stringify(r));
          return;
        }
        // Resume/fork rewrites whole history segments with the same uuids (only slug,
        // forkedFrom, version, cwd differ): keep the first position, take the latest copy.
        const u = r?.uuid;
        if (u) {
          const i = tri.byUuid.get(u);
          if (i !== undefined) {
            tri.rows[i] = r;
            tri.dups++;
            return;
          }
          tri.byUuid.set(u, tri.rows.length);
        }
        tri.rows.push(r);
      }

      function computeStats(rows, idx = buildIndex(rows)) {
        let firstTs,
          lastTs,
          nUser = 0,
          nAsstAnon = 0,
          nService = 0;
        // One API response is written as several lines (one per content block).
        const asstIds = new Set();
        const newTypes = new Set();
        for (const r of rows) {
          if (typeof r?.timestamp === "string" && r.timestamp) {
            firstTs ??= r.timestamp;
            lastTs = r.timestamp;
          }
          const t = r?.type;
          if (t === "user") {
            // Same plan as the feed: wrappers, markers and echoes are not messages; a reply
            // typed while a tool ran sits next to its tool_result and is one.
            if (isHumanMessage(r, idx)) nUser++;
          } else if (t === "assistant") {
            if (r.isApiErrorMessage) continue;
            const id = r.message?.id || r.uuid;
            if (id) asstIds.add(id);
            else nAsstAnon++; // hand-made files (demo.jsonl) carry no ids at all
          } else if (typeof t === "string" && t !== "system") nService++;
          if (t !== "user" && t !== "assistant" && r && typeof r === "object") {
            const k = missingRuleKey(r);
            if (k) newTypes.add(k);
            // Queued prompts are chat messages too — counted by the same rule the feed uses.
            let s = null;
            try {
              s = describeRecord(r, idx);
            } catch {} // the feed shows such a record as an error card, not a message
            if (s && !s.hide && s.kind === "user" && s.prose) nUser++;
          }
        }
        return {
          firstTs,
          lastTs,
          nUser,
          nAsst: asstIds.size + nAsstAnon,
          nService,
          newTypes: [...newTypes].sort(),
        };
      }
      // ===== end triage =====

      // ===== rules =====
      // Rule tables (registry) for service records. A rule is data: which filter bucket
      // (kind) a record goes to and how to summarize it. Rules never build HTML —
      // rowToEntries escapes everything it gets from here. A record without a rule is
      // "recognized" when it has rendered[] text or a typical text field, otherwise
      // "unknown" (JSON dump). The badge is the raw type name, so adding a rule needs
      // no translations. DOM-free like the triage section (see test/rules.test.mjs).
      // Rule fields (value or fn(payload, record)): icon, kind, who, summary, body
      // (undefined → default text, null → none, string, or { json }), md, hide,
      // prose (render like a chat message), sensitive (no preview), divider, images
      // (image blocks drawn when the entry is opened).

      const hasOwn = (o, k) => k != null && Object.prototype.hasOwnProperty.call(o, k);
      const arr = (x) => (Array.isArray(x) ? x : []);
      const clip = (s, n = 80) => {
        const p = String(s ?? "")
          .replace(/\s+/g, " ")
          .trim();
        return p.length > n ? p.slice(0, n) + "…" : p;
      };
      const fmtDur = (ms) => {
        if (typeof ms !== "number" || !isFinite(ms)) return "";
        if (ms < 1000) return `${Math.round(ms)}ms`;
        const sec = ms / 1000;
        if (sec < 60) return `${sec.toFixed(1)}s`;
        const m = Math.floor(sec / 60);
        if (m < 60) return `${m}m ${Math.round(sec % 60)}s`;
        return `${Math.floor(m / 60)}h ${m % 60}m`;
      };
      const fmtK = (n) =>
        typeof n !== "number" ? "?" : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n);
      const joinDot = (...xs) =>
        xs.filter((x) => x != null && x !== "" && x !== false && x !== 0).join(" · ");
      const textLines = (...xs) =>
        xs
          .flat()
          .filter((x) => x != null && x !== "")
          .map((x) => (typeof x === "string" ? x : JSON.stringify(x)))
          .join("\n");
      const baseName = (path) => String(path ?? "").split("/").pop();
      // Keys of a plain object only — a string here would yield one key per character.
      const objKeys = (o) => (o && typeof o === "object" && !Array.isArray(o) ? Object.keys(o) : []);

      // Untruncated JSON for the full-text panel; never throws (deep nesting → RangeError).
      const jsonFull = (v) => {
        try {
          return JSON.stringify(v, null, 2);
        } catch (err) {
          return `[unserializable: ${err.message}]`;
        }
      };

      const REMINDER_WRAP = /^<system-reminder>\n?([\s\S]*?)\n?<\/system-reminder>$/;
      // rendered[] (CLI 2.1.268+): the text the model actually saw for this record.
      function renderedText(r) {
        return arr(r?.rendered)
          .map((x) => (typeof x === "string" ? x : typeof x?.content === "string" ? x.content : ""))
          .map((t) => t.trim().replace(REMINDER_WRAP, "$1"))
          .filter(Boolean)
          .join("\n\n");
      }
      const TEXT_FIELDS = ["text", "content", "prompt", "snippet", "planContent", "banner", "message"];
      function typicalText(payload) {
        for (const k of TEXT_FIELDS) {
          const v = payload?.[k];
          if (typeof v === "string" && v.trim()) return v;
        }
        return "";
      }

      const HIDE = { hide: true };
      // An image attached with @path: the base64 sits in content.file, not in a content block.
      const fileImage = (a) =>
        a?.content?.type === "image" && a.content.file && typeof a.content.file === "object"
          ? { type: "image", source: { type: "base64", media_type: a.content.file.type, data: a.content.file.base64 } }
          : null;
      const hookName = (a) => a.hookName ?? a.hookEvent;
      const hookSummary = (a) =>
        joinDot(hookName(a), a.exitCode != null && `exit ${a.exitCode}`, fmtDur(a.durationMs));
      const LEVEL_ICON = { warning: "⚠", error: "❌" };

      const SYSTEM_RULES = {
        turn_duration: {
          icon: "⏱",
          summary: (r) =>
            joinDot(
              fmtDur(r.durationMs),
              r.messageCount != null && `${r.messageCount} msgs`,
              r.pendingBackgroundAgentCount && `${r.pendingBackgroundAgentCount} bg agents`,
            ),
          body: null,
        },
        stop_hook_summary: {
          icon: "🪝",
          kind: (r) => (arr(r.hookErrors).length || r.preventedContinuation ? "hook error" : "hook"),
          summary: (r) =>
            joinDot(
              `${r.hookCount ?? arr(r.hookInfos).length} hooks`,
              arr(r.hookErrors).length && `⚠ ${arr(r.hookErrors).length} errors`,
              r.preventedContinuation && "⛔ blocked",
              clip(r.stopReason, 60),
            ),
          body: (r) =>
            textLines(
              arr(r.hookInfos).map((h) => joinDot(h?.command ?? clip(h?.promptText, 120), fmtDur(h?.durationMs))),
              arr(r.hookErrors).map((e) => `⚠ ${typeof e === "string" ? e : JSON.stringify(e)}`),
            ),
        },
        away_summary: { icon: "📋", summary: (r) => clip(r.content, 100), md: true },
        local_command: { icon: "⚡", summary: (r) => commandSummary(r.content) },
        compact_boundary: {
          icon: "✂",
          divider: true,
          summary: (r) => {
            const m = r.compactMetadata ?? {};
            return joinDot(
              `compact (${m.trigger ?? "?"})`,
              m.preTokens != null &&
                (m.postTokens != null ? `${fmtK(m.preTokens)} → ${fmtK(m.postTokens)} tokens` : `${fmtK(m.preTokens)} tokens`),
              fmtDur(m.durationMs),
            );
          },
          body: (r) => ({ json: r.compactMetadata ?? r }),
        },
        model_refusal_fallback: {
          icon: "⚠",
          summary: (r) => joinDot(`${r.originalModel ?? "?"} → ${r.fallbackModel ?? "?"}`, r.apiRefusalCategory),
        },
        model_refusal_no_fallback: {
          icon: "⛔",
          kind: "system error",
          summary: (r) => joinDot(r.originalModel, r.apiRefusalCategory),
          body: (r) => r.apiRefusalExplanation || r.content || undefined,
        },
        api_error: {
          icon: "❌",
          kind: "system error",
          summary: (r) => {
            const e = r.error;
            const msg = e?.error?.error?.message ?? e?.error?.message ?? e?.message;
            return joinDot(
              "API error",
              e?.status,
              clip(msg, 80),
              r.retryAttempt != null && `retry ${r.retryAttempt}/${r.maxRetries ?? "?"}`,
              fmtDur(r.retryInMs),
            );
          },
          body: (r) => ({ json: r.error ?? r }),
        },
        informational: {
          icon: (r) => (hasOwn(LEVEL_ICON, r.level) ? LEVEL_ICON[r.level] : "ℹ"),
          kind: (r) => (r.level === "error" ? "system error" : "system"),
          summary: (r) => clip(r.content, 120),
          body: (r) => (typeof r.content === "string" && r.content.length > 120 ? r.content : null),
        },
        scheduled_task_fire: { icon: "⏰", summary: (r) => joinDot(clip(r.content, 100), r.cron), body: null },
      };

      // Text inside the first <tag>…</tag>, trimmed; undefined when absent or unclosed.
      // indexOf, not a lazy regex: a wall of unclosed tags made the regex quadratic.
      function tagText(s, tag) {
        const open = `<${tag}>`;
        const i = s.indexOf(open);
        if (i < 0) return undefined;
        const j = s.indexOf(`</${tag}>`, i + open.length);
        return j < 0 ? undefined : s.slice(i + open.length, j).trim();
      }

      function commandSummary(content) {
        const s = typeof content === "string" ? content : "";
        const pick = (tag) => tagText(s, tag);
        const name = pick("command-name");
        if (name) return joinDot(name, clip(pick("command-args"), 60));
        const out = pick("local-command-stdout");
        if (out != null) return `stdout · ${clip(out, 80)}`;
        return clip(s, 100);
      }

      const ATTACHMENT_RULES = {
        // Typed while the agent was busy: human prompts are real user messages,
        // task notifications are machine messages (owner decision 2026-08-24).
        queued_command: {
          icon: (a, r) => ({ human: "⏳", report: "↩", peer: "✉", task: "⏳" })[queuedFrom(a, r)],
          kind: (a, r) => ({ human: "user", report: "assistant report", peer: "task-note", task: "task-note" })[queuedFrom(a, r)],
          who: (a, r) =>
            ({ human: "user", report: "subagent", peer: clip(a.origin?.name ?? "session", 40), task: "task" })[queuedFrom(a, r)],
          prose: (a, r) => queuedFrom(a, r) === "human",
          summary: (a, r, idx) => {
            const from = queuedFrom(a, r);
            if (from === "report") return reportSpec(a.prompt, idx).summary;
            if (from === "peer")
              return joinDot(a.origin?.name ?? a.prompt?.match?.(/from-name="([^"]*)"/)?.[1], clip(a.origin?.body ?? a.prompt, 90));
            return (from === "task" ? taskNoteSummary(a.prompt) : null) ?? clip(a.prompt, 90);
          },
          body: (a, r, idx) =>
            queuedFrom(a, r) === "report" ? reportSpec(a.prompt, idx).body : typeof a.prompt === "string" ? a.prompt : undefined,
          md: true,
        },
        hook_success: {
          icon: "🪝",
          kind: "hook",
          summary: hookSummary,
          body: (a) => textLines(a.stdout, a.stderr, a.content),
        },
        hook_non_blocking_error: {
          icon: "🪝",
          kind: "hook error",
          summary: hookSummary,
          body: (a) => textLines(a.stderr, a.stdout, a.command && `command: ${a.command}`),
        },
        hook_blocking_error: {
          icon: "⛔",
          kind: "hook error",
          summary: (a) => joinDot(hookName(a), clip(a.blockingError?.blockingError, 80)),
          body: (a) =>
            textLines(a.blockingError?.blockingError, a.blockingError?.command && `command: ${a.blockingError.command}`),
        },
        hook_cancelled: {
          icon: "⏱",
          kind: "hook error",
          summary: (a) =>
            joinDot(hookName(a), a.timedOut ? `timeout ${fmtDur(a.timeoutMs)}` : "cancelled", fmtDur(a.durationMs)),
          body: (a) => a.command ?? null,
        },
        hook_additional_context: {
          icon: "🪝",
          kind: "hook",
          summary: (a) => joinDot(hookName(a), clip(textLines(a.content), 80)),
          body: (a) => textLines(a.content) || undefined,
        },
        hook_system_message: {
          icon: "🪝",
          kind: "hook",
          summary: (a) => joinDot(hookName(a), clip(a.content, 80)),
        },
        file: {
          icon: "📄",
          summary: (a) =>
            joinDot(a.displayPath ?? a.filename, a.content?.file?.numLines != null && `${a.content.file.numLines} lines`),
          body: (a) => (fileImage(a) ? imageInfo(fileImage(a)).label : a.content?.file?.content),
          images: (a) => (fileImage(a) ? [fileImage(a)] : null),
        },
        edited_text_file: { icon: "✏️", summary: (a) => a.displayPath ?? a.filename },
        directory: { icon: "📁", summary: (a) => a.displayPath ?? a.path },
        compact_file_reference: { icon: "📄", summary: (a) => a.displayPath ?? a.filename, body: null },
        invoked_skills: {
          icon: "⭐",
          summary: (a) =>
            arr(a.skills)
              .map((x) => x?.name)
              .filter(Boolean)
              .join(", "),
          body: (a) => arr(a.skills).map((x) => `# ${x?.name ?? "?"}\n\n${x?.content ?? ""}`).join("\n\n") || undefined,
          md: true,
        },
        nested_memory: {
          icon: "🧠",
          summary: (a) => a.displayPath ?? a.path,
          body: (a) => a.content?.content,
          md: true,
        },
        plan_file_reference: { icon: "📝", summary: (a) => baseName(a.planFilePath), body: (a) => a.planContent, md: true },
        plan_mode: { icon: "📝", kind: "system", summary: (a) => joinDot("plan mode", baseName(a.planFilePath)), body: null },
        plan_mode_exit: {
          icon: "📝",
          kind: "system",
          summary: (a) => joinDot("plan mode exit", baseName(a.planFilePath)),
          body: null,
        },
        plan_mode_reentry: {
          icon: "📝",
          kind: "system",
          summary: (a) => joinDot("plan mode re-entry", baseName(a.planFilePath)),
          body: null,
        },
        // Sensitive: CLAUDE.md files, system prompt, e-mail, paths. Summary carries
        // counts only, so a screenshot of the collapsed feed leaks nothing.
        instructions: {
          icon: "📜",
          sensitive: true,
          summary: (a) => `${arr(a.files).length} files`,
          body: (a) => arr(a.files).map((f) => joinDot(f?.type, f?.path)).join("\n") || undefined,
        },
        prompt_snapshot: {
          icon: "🧾",
          sensitive: true,
          summary: (a) => `${arr(a.systemPrompt).length} parts`,
          body: (a) => arr(a.systemPrompt).filter((x) => typeof x === "string").join("\n\n---\n\n") || undefined,
        },
        session_context: {
          icon: "🔒",
          sensitive: true,
          summary: (a) => objKeys(a.context).join(", "),
        },
        environment: {
          icon: "🖥",
          sensitive: true,
          summary: (a) => joinDot(a.snapshot?.platform, a.snapshot?.shell),
        },
        credential_org: HIDE,
        total_tokens_reminder: HIDE,
        model: { icon: "🤖", summary: (a) => a.identity?.modelId ?? clip(a.text), body: null },
        date: { icon: "📅", summary: (a) => a.date, body: null },
        date_change: { icon: "📅", kind: "system", summary: (a) => joinDot("date change", a.newDate), body: null },
        language: { icon: "🌐", summary: (a) => a.language, body: null },
        diagnostics: {
          icon: "🩺",
          summary: (a) =>
            joinDot(
              `${arr(a.files).length} files`,
              `${arr(a.files).reduce((n, f) => n + arr(f?.diagnostics).length, 0)} issues`,
            ),
          body: (a) =>
            arr(a.files)
              .flatMap((f) =>
                arr(f?.diagnostics).map(
                  (d) =>
                    `${baseName(f?.uri)}:${(d?.range?.start?.line ?? 0) + 1} ${d?.severity ?? ""} ${d?.message ?? ""}`,
                ),
              )
              .join("\n") || undefined,
        },
        deferred_tools_delta: {
          icon: "🔧",
          summary: (a) =>
            joinDot(arr(a.addedNames).length && `+${arr(a.addedNames).length}`, arr(a.removedNames).length && `−${arr(a.removedNames).length}`),
        },
        deferred_tools_record: {
          icon: "🔧",
          summary: (a) => `${arr(a.entries).length} tools`,
          body: (a) =>
            arr(a.entries)
              .map((e) => e?.name)
              .filter(Boolean)
              .join("\n") || undefined,
        },
        mcp_instructions_delta: { icon: "🔌", summary: (a) => arr(a.addedNames).join(", ") },
        agent_listing_delta: { icon: "🤖", summary: (a) => `${arr(a.addedTypes).length} agent types` },
        skill_listing: { icon: "⭐", summary: (a) => `${a.skillCount ?? arr(a.names).length} skills` },
        command_permissions: {
          icon: "🔐",
          summary: (a) => `${arr(a.allowedTools).length} allowed`,
          body: (a) => textLines(a.allowedTools) || null,
        },
        task_reminder: {
          icon: "☑️",
          hide: (a) => !a.itemCount,
          summary: (a) => `${a.itemCount} tasks`,
          body: (a) => ({ json: a.content ?? a }),
        },
        task_status: {
          icon: "🤖",
          kind: "task-note",
          who: "task",
          summary: (a) => joinDot(a.description, a.status),
          body: (a) => a.deltaSummary ?? null,
        },
        auto_mode: { icon: "🤖", summary: "auto mode" },
        auto_mode_exit: { icon: "🤖", summary: "auto mode exit" },
        ultrathink_effort: { icon: "🧠", summary: (a) => a.level, body: null },
        ultra_effort_enter: { icon: "🧠" },
        workflow_keyword_request: { icon: "🔀" },
        silent_turn_reminder: { icon: "💬" },
        bash_output_audience_note: { icon: "💬" },
        batching_reminder_sent: { icon: "💬" },
        read_truncation_notice: { icon: "✂", summary: (a) => clip(a.banner, 100), body: null },
        remote_session_change: { icon: "🔗" },
        session_cron_carry: { icon: "⏰", summary: (a) => clip(a.wakeup?.reason, 80), body: (a) => ({ json: a }) },
        thinking_drop: {
          icon: "💭",
          summary: (a) =>
            joinDot(a.newlyDropped?.reason, a.newlyDropped?.blockCount != null && `${a.newlyDropped.blockCount} blocks`),
          body: (a) => ({ json: a }),
        },
        structured_output: { icon: "🧩", kind: "task-note", who: "task", body: (a) => ({ json: a.data ?? a }) },
        dynamic_skill: { icon: "⭐", summary: (a) => arr(a.skillNames).join(", "), body: null },
        goal_status: {
          icon: "🎯",
          kind: "system",
          summary: (a) => joinDot(a.met ? "✅ met" : "⏳ not met", clip(a.condition, 80)),
          body: (a) => a.reason ?? null,
        },
      };

      const RECORD_RULES = {
        mode: HIDE,
        "atis-latch": HIDE,
        "last-prompt": HIDE,
        "agent-setting": HIDE,
        // track: the CLI rewrites these on every turn — only a change is shown (index.statePrev).
        "custom-title": { icon: "🏷", track: (r) => r.customTitle, summary: (r) => r.customTitle, body: null },
        "ai-title": { icon: "🏷", track: (r) => r.aiTitle, summary: (r) => r.aiTitle, body: null },
        "agent-name": { icon: "🏷", track: (r) => r.agentName, summary: (r) => r.agentName, body: null },
        "permission-mode": {
          icon: "🔐",
          kind: "system",
          track: (r) => r.permissionMode,
          summary: (r) => r.permissionMode,
          body: null,
        },
        // A message typed while Claude works. Shown once, and only when no later record
        // carries the same text (index.queueShown): "sent" — the queue is its only trace
        // (older CLIs), "returned" — pulled back to the input box (popAll).
        "queue-operation": {
          hide: (r, _, idx) => !!idx && !idx.queueShown.has(r),
          icon: (r, _, idx) => (idx?.queueShown.get(r) === "returned" ? "↩" : "⏳"),
          kind: (r, _, idx) => (idx?.queueShown.get(r) === "sent" ? "user" : "ui"),
          who: (r, _, idx) => (idx?.queueShown.get(r) === "sent" ? "user" : "queue"),
          prose: (r, _, idx) => idx?.queueShown.get(r) === "sent",
          summary: (r, _, idx) =>
            joinDot(idx?.queueShown.get(r) === "returned" ? "returned to input, not sent" : r.operation, clip(r.content, 80)),
          body: (r) => (typeof r.content === "string" ? r.content : null),
          md: true,
        },
        "file-history-snapshot": {
          icon: "💾",
          summary: (r) => `${objKeys(r.snapshot?.trackedFileBackups).length} files`,
          body: null,
        },
        "file-history-delta": { icon: "💾", summary: (r) => r.trackingPath, body: null },
        "pr-link": {
          icon: "🔗",
          kind: "system",
          summary: (r) => joinDot(r.prRepository, r.prNumber != null && `#${r.prNumber}`),
          body: (r) => (typeof r.prUrl === "string" ? r.prUrl : null),
          md: true,
        },
        "fork-context-ref": { icon: "🍴", kind: "system", summary: (r) => r.parentSessionId, body: null },
        progress: { icon: "⏳", summary: (r) => r.data?.type, body: (r) => ({ json: r.data ?? r }) },
        "cost-state": {
          icon: "💲",
          kind: "system",
          summary: (r) =>
            joinDot(
              typeof r.totalCostUSD === "number" && `$${r.totalCostUSD.toFixed(2)}`,
              fmtDur(r.totalDuration),
              r.totalLinesAdded != null && `+${r.totalLinesAdded} −${r.totalLinesRemoved ?? 0}`,
            ),
          body: (r) => ({ json: r.modelUsage ?? r }),
        },
        "frame-link": {
          icon: "🖼",
          summary: (r) => r.title ?? baseName(r.path),
          body: (r) => (typeof r.frameUrl === "string" ? r.frameUrl : null),
          md: true,
        },
        "continued-in": { icon: "➡", kind: "system", summary: (r) => r.continuedInSessionId, body: null },
        relocated: { icon: "📂", kind: "system", summary: (r) => r.relocatedCwd, body: null },
        "worktree-state": {
          icon: "🌿",
          kind: "system",
          summary: (r) => joinDot(r.worktreeSession?.worktreeName, r.worktreeSession?.worktreeBranch),
          body: (r) => ({ json: r.worktreeSession ?? r }),
        },
        summary: { icon: "📋", kind: "system", summary: (r) => clip(r.summary, 100), body: (r) => r.summary },
        // workflow journals (subagents/workflows/wf_*)
        launched: { icon: "🔀", body: null },
        started: { icon: "🔀", summary: (r) => joinDot(r.label, r.phase), body: null },
        result: { icon: "🔀", summary: (r) => clip(r.result?.scenario ?? r.agentId), body: (r) => ({ json: r.result ?? r }) },
      };

      // Tool calls that are really messages, not tool use. body(input, block, index).
      const TOOL_RULES = {
        // CLI 2.1.271+: a subagent's final report travels in this call's input.
        SubagentHandback: { icon: "↩", kind: "assistant", who: "handback", body: (i) => i?.message },
        // Owner decision 2026-10-25: question and the human's answer in one card that
        // reader mode keeps; the matching tool_result is swallowed (index.askCards).
        AskUserQuestion: {
          icon: "❓",
          kind: "assistant ask",
          who: "question",
          body: (i, b, idx) => askBody(i, idx?.ask.get(b.id)),
        },
      };

      function describeTool(b, idx = null) {
        if (!hasOwn(TOOL_RULES, b?.name)) return null;
        const rule = TOOL_RULES[b.name];
        const body = rule.body(b.input, b, idx);
        if (typeof body !== "string" || !body.trim()) return null; // generic tool card instead
        return { prose: true, kind: rule.kind, who: rule.who, tag: `${rule.icon} ${b.name}`, body, md: true };
      }

      function askBody(input, res) {
        const qs = arr(input?.questions).filter((q) => typeof q?.question === "string");
        if (!qs.length) return null;
        const answers = res?.answers && typeof res.answers === "object" ? res.answers : {};
        const notes = res?.annotations && typeof res.annotations === "object" ? res.annotations : {};
        const structured = qs.some((q) => hasOwn(answers, q.question));
        const parts = qs.map((q) => {
          if (!structured) return `**${q.question}**`;
          const a = hasOwn(answers, q.question) ? String(answers[q.question]) : "—";
          const n = hasOwn(notes, q.question) ? notes[q.question]?.notes : null;
          return `**${q.question}**\n\n→ ${a}` + (typeof n === "string" && n ? `\n\n> ${n}` : "");
        });
        // No structured answers (older CLI, or "clarify"/decline, which arrives as an
        // error): the human's words are somewhere in the result text — show all of it once.
        if (!structured) parts.push(res ? `→ ${res.isError ? "⛔ " : ""}${res.text}` : "→ —");
        else if (res?.afk) parts.unshift("⏱ No answer in time — Claude went on alone. Below: a draft selection the user had not sent.");
        return parts.join("\n\n");
      }

      // ----- tool results and images (phase 5') -----
      // Owner decision 2: base64 images are real <img>, the data: URI is built here from
      // a checked source — never from markdown (markdown images stay inert).
      const IMAGE_TYPES = new Set(["image/png", "image/jpeg", "image/gif", "image/webp"]);
      const MAX_IMAGE_B64 = 8_000_000;
      const BASE64 = /^[A-Za-z0-9+/]*={0,2}$/;
      function imageInfo(b) {
        const s = b?.source && typeof b.source === "object" ? b.source : {};
        const mt = typeof s.media_type === "string" ? s.media_type.toLowerCase() : "?";
        const data = typeof s.data === "string" ? s.data : null;
        const size = data ? `${Math.max(1, Math.round((data.length * 3) / 4 / 1024))} KB` : null;
        const ok =
          s.type === "base64" && IMAGE_TYPES.has(mt) && data !== null && data.length <= MAX_IMAGE_B64 && BASE64.test(data);
        // The charset check above is what makes src safe inside an attribute.
        return { ok, src: ok ? `data:${mt};base64,${data}` : null, label: `[image: ${joinDot(mt, size)}]` };
      }
      // Text of one tool_result content item — an image is its label, never base64.
      function blockText(x) {
        if (typeof x === "string") return x;
        if (x?.type === "image") return imageInfo(x).label;
        return typeof x?.text === "string" && x.text ? x.text : jsonFull(x);
      }
      // A result too large for the transcript: only a ~2 KB preview is here, the rest
      // was saved next to the session (<session>/tool-results/…).
      const PERSISTED = "<persisted-output>";
      function persistedInfo(text) {
        if (typeof text !== "string" || !text.startsWith(PERSISTED)) return null;
        const head = text.slice(PERSISTED.length, PERSISTED.length + 2000);
        const m = head.match(/^Output too large \(([^)\n]{1,40})\)\. Full output saved to: ([^\n]+)$/m);
        // the output itself: after the header and the "Preview (first 2KB):" line
        const gap = text.indexOf("\n\n");
        const preview = (m && gap >= 0 ? text.slice(gap + 2).replace(/^Preview[^\n]*\n/, "") : text.slice(PERSISTED.length))
          .replace(/(\n\.\.\.)?\n?<\/persisted-output>\s*$/, "")
          .trim();
        return m ? { size: m[1], path: m[2].trim(), preview } : { size: null, path: null, preview };
      }
      const num = (n) => typeof n === "number" && isFinite(n);
      function agentStats(tur) {
        if (!tur || typeof tur !== "object" || typeof tur.agentId !== "string" || !num(tur.totalTokens)) return null;
        return joinDot(
          `🤖 ${fmtK(tur.totalTokens)} tokens`,
          fmtDur(tur.totalDurationMs),
          num(tur.totalToolUseCount) && `${tur.totalToolUseCount} tools`,
        );
      }

      // Background subagents (async_launched) report their totals in the finish
      // notification: <usage> as tags or "key: N" lines, subagent_ or total_tokens.
      function taskNoteSummary(t) {
        if (typeof t !== "string" || !t.trimStart().startsWith("<task-notification>")) return null;
        const u = t.lastIndexOf("<usage>"); // the result before it may quote a <usage> of its own
        const usage = u < 0 ? "" : t.slice(u, u + 1000);
        const n = (k) => {
          const m = usage.match(new RegExp(`${k}(?:>|: )(\\d{1,15})`));
          return m ? Number(m[1]) : undefined;
        };
        const tokens = n("subagent_tokens") ?? n("total_tokens");
        const status = tagText(t, "status");
        return (
          joinDot(
            clip(tagText(t, "summary") ?? "", 100),
            status && status !== "completed" && `⚠ ${clip(status, 20)}`,
            tokens !== undefined && `🤖 ${fmtK(tokens)} tokens`,
            fmtDur(n("duration_ms")),
            n("tool_uses") !== undefined && `${n("tool_uses")} tools`,
          ) || null
        );
      }

      // Who wrote a queued prompt: "human" | "report" (a subagent's hand-back) | "peer"
      // (another session) | "task". CLI 2.1.28x+ says it in origin.kind; older files
      // only by the leading tag. commandMode "prompt" alone is not enough.
      function queuedFrom(a, r) {
        const p = typeof a?.prompt === "string" ? a.prompt.trimStart() : "";
        if (p.startsWith("<agent-message")) return "report";
        if (p.startsWith("<cross-session-message") || a?.origin?.kind === "peer") return "peer";
        if (a?.commandMode !== "prompt" || r?.isMeta === true || QUEUE_MACHINE.test(p)) return "task";
        const k = a?.origin?.kind;
        return k == null || k === "human" ? "human" : "task";
      }

      // The task the parent model gave a subagent (or a fork): readable like a message,
      // but not the human's.
      const parentTask = (body) => ({ kind: "user", who: "parent", tag: "🤖 task", summary: clip(body, 100), body, prose: true, md: true });

      // A declined tool call may carry the human's instruction: "…the user said:\n<words>".
      const DECLINED = "The user doesn't want to proceed with this tool use.";
      const SAID = "the user said:\n";
      function declinedWords(b) {
        if (b?.is_error !== true) return null;
        const t =
          typeof b.content === "string"
            ? b.content
            : arr(b.content)
                .map((x) => (typeof x?.text === "string" ? x.text : ""))
                .join("\n");
        if (!t.startsWith(DECLINED)) return null;
        const i = t.indexOf(SAID);
        return i < 0 ? null : t.slice(i + SAID.length).trim() || null;
      }

      // ----- user records: what the CLI writes as "user" but no human typed (phase 3') -----
      // Detection mirrors research/classify_jsonl.py, validated on the whole corpus.
      const INTERRUPTED = new Set([
        "[Request interrupted by user]",
        "[Request interrupted by user for tool use]",
        "[Request interrupted]",
      ]);
      const CONTINUE_MARKER = "Continue from where you left off.";
      const AGENT_MSG_PREFIX = "Another Claude session sent a message:";
      const LEAD_TAG = /^<([a-z][a-z0-9-]{2,40})>/i;
      // Tags the CLI wraps machine text in. A record is a wrapper only when nothing but
      // closed wrapper blocks is left — text after them was typed by a human.
      const WRAPPER_TAGS = new Set([
        "task-notification",
        "local-command-caveat",
        "command-name",
        "command-message",
        "command-args",
        "local-command-stdout",
        "local-command-stderr",
        "bash-input",
        "bash-stdout",
        "bash-stderr",
        "system-reminder",
        "fork-boilerplate",
        "skill-format",
      ]);
      function afterWrappers(t) {
        let rest = t.trim();
        for (let n = 0; n < 50; n++) {
          const tag = rest.match(LEAD_TAG)?.[1];
          if (!tag || !WRAPPER_TAGS.has(tag.toLowerCase())) return rest;
          const close = `</${tag}>`;
          const end = rest.indexOf(close);
          if (end < 0) return rest;
          rest = rest.slice(end + close.length).trim();
        }
        return rest;
      }
      const ANSI = /\u001b\[[0-9;]*[A-Za-z]/g;
      // Owner decision 2026-10-25: every /compact stays visible in reader mode (its args
      // are the human's words); it is a command to the CLI, so not counted as a message.
      const commandSpec = (t) => ({
        kind: tagText(t, "command-name") === "/compact" ? "user command" : "system",
        who: "command",
        tag: "⚡ command",
        summary: commandSummary(t) || null,
        body: t,
      });
      const bashOutputSpec = (t) => {
        const out = tagText(t, "bash-stdout") ?? "";
        const err = tagText(t, "bash-stderr") ?? "";
        const body = textLines(out, err && `[stderr]\n${err}`);
        return {
          kind: err ? "tool-result error" : "tool-result",
          who: "shell",
          tag: "! output",
          summary: clip(body, 100) || null,
          body: body || null,
        };
      };
      // Leading wrapper tag → spec. legacy: keep the pre-3' rendering path.
      const USER_TAG_RULES = {
        "task-notification": () => ({ legacy: "task" }),
        "local-command-caveat": () => ({ legacy: "meta" }),
        "fork-boilerplate": () => ({ legacy: "meta" }),
        "command-name": commandSpec,
        "command-message": commandSpec, // plugin skills write the tags in reverse order
        "local-command-stdout": (t) => {
          const out = (tagText(t, "local-command-stdout") ?? t).replace(ANSI, "").trim();
          return { kind: "system", who: "command", tag: "📤 stdout", summary: clip(out, 100) || null, body: out || null };
        },
        "bash-input": (t) => {
          const cmd = tagText(t, "bash-input") ?? t;
          return { kind: "tool-use", who: "shell", tag: "! shell", summary: clip(cmd, 100) || null, body: cmd || null };
        },
        "bash-stdout": bashOutputSpec,
        "bash-stderr": bashOutputSpec,
        // Collapsible, never hidden: one corpus record is live human text after the tag.
        "system-reminder": (t) => ({ kind: "meta", who: "inject", tag: "system-reminder", summary: null, body: t }),
      };

      function reportSpec(t, idx) {
        const id = t.match(/<agent-message from="([^"]*)"/)?.[1] ?? null;
        const open = t.indexOf("<agent-message");
        const start = open < 0 ? -1 : t.indexOf(">", open);
        const end = t.lastIndexOf("</agent-message>");
        const inner = start >= 0 && end > start ? t.slice(start + 1, end) : t;
        // The harness indents every report line by two spaces; its own frame is not indented.
        const lines = inner.split("\n");
        const first = lines.findIndex((l) => l.startsWith("  "));
        const body =
          first < 0
            ? inner.trim()
            : lines
                .slice(first)
                .map((l) => (l.startsWith("  ") ? l.slice(2) : l))
                .join("\n")
                .trim()
                // the harness may prepend its own note about neutralized tags
                .replace(/^\[harness:[^\n]*\]\s*/, "");
        const desc = id != null && idx?.agentDesc.has(id) ? idx.agentDesc.get(id) : null;
        return {
          kind: "assistant report",
          who: "subagent",
          tag: "↩ report",
          summary: joinDot(desc ?? id ?? "?", clip(body, 70)),
          body: body || null,
          md: true,
        };
      }

      // null → a message a human typed; otherwise a spec for specEntry (or legacy / hide).
      function describeUser(r, text, idx = null) {
        const meta = r.isMeta === true;
        if (r.isCompactSummary === true)
          return { kind: "meta", who: "compact", tag: "✂ compact summary", summary: null, body: text || null, md: true };
        if (r.sourceToolUseID) {
          const dir = text.match(/^Base directory for this skill: (\S+)/m)?.[1];
          const name = dir ? baseName(dir.replace(/\/+$/, "")) : text.match(/^# (.+)$/m)?.[1];
          return { kind: "meta", who: "skill", tag: "⭐ skill", summary: name ? clip(name, 80) : null, body: text || null, md: true };
        }
        // first record of a subagent transcript: the prompt the parent passed to Agent
        if (r.isSidechain === true && !r.parentUuid && !meta) return parentTask(text);
        const t = text.trim();
        if (INTERRUPTED.has(t)) return { kind: "meta", who: "user", tag: "⛔ interrupted", summary: t, body: null };
        if (/^\/compact(\s|$)/.test(t) && idx?.compactEchoes.has(r.uuid)) return { hide: true };
        if (meta && t === CONTINUE_MARKER)
          return { kind: "meta", who: "inject", tag: "▶ continue", summary: "resume continuation", body: null };
        if (meta && t.startsWith(AGENT_MSG_PREFIX)) return reportSpec(t, idx);
        const tag = t.match(LEAD_TAG)?.[1]?.toLowerCase();
        if (tag && hasOwn(USER_TAG_RULES, tag)) {
          // A task notification's tail ("Full transcript available at …") is machine text
          // too, but the CLI always closes the tag — an unclosed one was typed by a human.
          const live = tag === "task-notification" ? tagText(t, tag) === undefined : !!afterWrappers(t);
          if (live && tag === "fork-boilerplate") return parentTask(afterWrappers(t)); // the fork's directive
          if (live) return meta ? { legacy: "meta" } : null;
          return USER_TAG_RULES[tag](t);
        }
        return meta ? { legacy: "meta" } : null;
      }

      function userTextOf(r) {
        const c = r?.message?.content;
        if (typeof c === "string") return c;
        return arr(c)
          .filter((b) => b?.type === "text" && typeof b.text === "string")
          .map((b) => b.text)
          .join("\n");
      }

      // How a user record appears in the feed; the user count reads the same plan.
      // Items: { type: "result", block } | { type: "text", text, spec } — spec null means
      // typed by a human. An answered AskUserQuestion result is folded into its card.
      function planUserRecord(r, idx = null) {
        const c = r?.message?.content;
        const out = [];
        const text = (t) => {
          const spec = describeUser(r, t, idx);
          if (!spec?.hide) out.push({ type: "text", text: t, spec });
        };
        if (typeof c === "string") text(c);
        else
          for (const b of arr(c)) {
            if (b?.type === "tool_result") {
              if (idx?.askCards.has(b.tool_use_id)) continue;
              out.push({ type: "result", block: b });
              const said = declinedWords(b);
              if (said)
                out.push({
                  type: "text",
                  text: said,
                  spec: { kind: "user", who: "user", tag: "⛔ declined", summary: null, body: said, prose: true, md: true, human: true },
                });
            } else if (b?.type === "text" && typeof b.text === "string" && b.text.trim()) {
              // the CLI's own note next to a ToolSearch result
              if (b.text.trim() === "Tool loaded." && arr(c).some((x) => x?.type === "tool_result"))
                out.push({ type: "text", text: b.text, spec: { legacy: "meta" } });
              else text(b.text);
            }
            else if (b?.type === "image") {
              // Consecutive images are one item: Read writes PDF pages as a meta record of images.
              const last = out[out.length - 1];
              if (last?.type === "images") last.blocks.push(b);
              else out.push({ type: "images", blocks: [b], meta: r.isMeta === true });
            }
          }
        return out;
      }

      const isHumanMessage = (r, idx) =>
        planUserRecord(r, idx).some(
          (x) =>
            (x.type === "text" && (x.spec === null || x.spec.human === true) && x.text.trim() !== "") ||
            (x.type === "images" && !x.meta),
        );

      // Cross-record facts, one pass per file: answers of AskUserQuestion calls, task
      // descriptions of subagents, and which "/compact" lines are only the echo of a
      // manual compaction (a leaf followed by a manual compact_boundary).
      function buildIndex(rows) {
        const parents = new Set();
        const askCards = new Set();
        const ask = new Map();
        const agentDesc = new Map();
        const compactEchoes = new Set();
        const stateSame = new Set();
        const statePrev = new Map();
        const lastState = new Map();
        for (const r of rows) {
          if (!r || typeof r !== "object") continue;
          if (r.parentUuid) parents.add(r.parentUuid);
          const track = typeof r.type === "string" && hasOwn(RECORD_RULES, r.type) ? RECORD_RULES[r.type].track : null;
          if (track) {
            const val = String(track(r) ?? "");
            if (lastState.has(r.type)) {
              if (lastState.get(r.type) === val) stateSame.add(r);
              else statePrev.set(r, lastState.get(r.type));
            }
            lastState.set(r.type, val);
          }
          if (r.type === "assistant")
            for (const b of arr(r.message?.content))
              if (b?.type === "tool_use" && b.name === "AskUserQuestion" && b.id && askBody(b.input, null))
                askCards.add(b.id);
          const tur = r.toolUseResult;
          if (r.type === "user" && tur && typeof tur === "object" && typeof tur.agentId === "string")
            if (typeof tur.description === "string") agentDesc.set(tur.agentId, tur.description);
        }
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          if (r?.type !== "user") continue;
          for (const b of arr(r.message?.content)) {
            if (b?.type !== "tool_result" || !askCards.has(b.tool_use_id)) continue;
            const text =
              typeof b.content === "string"
                ? b.content
                : arr(b.content)
                    .map((x) => (typeof x?.text === "string" ? x.text : ""))
                    .join("\n");
            const tur = r.toolUseResult && typeof r.toolUseResult === "object" ? r.toolUseResult : {};
            ask.set(b.tool_use_id, {
              text,
              isError: b.is_error === true,
              answers: tur.answers,
              annotations: tur.annotations,
              // no answer in time: the CLI went on, answers hold what was selected, unsent
              afk: typeof tur.afkTimeoutMs === "number" || text.startsWith("No response after"),
            });
          }
          if (!r.uuid || parents.has(r.uuid) || !/^\/compact(\s|$)/.test(userTextOf(r).trim())) continue;
          // Look ahead over records with a uuid only: CLI 2.1.303 writes a batch of state
          // records (no uuid) in between. Hide the echo only when the command record that
          // carries the same args follows, so nothing the human typed disappears.
          let seen = 0;
          let boundary = false;
          let command = false;
          for (let j = i + 1; j < rows.length && seen < 15; j++) {
            const x = rows[j];
            if (!x?.uuid) continue;
            seen++;
            if (x.type === "system" && x.subtype === "compact_boundary" && x.compactMetadata?.trigger === "manual")
              boundary = true;
            else if (x.type === "user" && userTextOf(x).trim().startsWith("<command-name>/compact</command-name>"))
              command = true;
            if (boundary && command) {
              compactEchoes.add(r.uuid);
              break;
            }
          }
        }
        const queueShown = queueStatus(rows);
        return { parents, askCards, ask, agentDesc, compactEchoes, stateSame, statePrev, queueShown };
      }

      // Queue records → "sent" | "returned" for the one record of each queued message
      // that has to be shown. Corpus (2 851 files): a remove is the CLI taking the message
      // out for delivery — the same text arrives as queued_command in under 0.5 s, so the
      // queue copy is hidden; machine notifications always arrive as their own records.
      const QUEUE_MACHINE = /^<(task-notification|agent-message|cross-session-message)[\s>]/;
      const QUEUE_LOOKAHEAD = 200;
      const normText = (s) => s.replace(/\s+/g, " ").trim();
      function queueStatus(rows) {
        const shown = new Map();
        const done = new Set();
        const carried = new Map(); // row index → normalized texts that row delivers
        const carrierTexts = (j) => {
          if (carried.has(j)) return carried.get(j);
          const x = rows[j];
          let ts = [];
          if (x?.type === "user") {
            const c = x.message?.content;
            ts = typeof c === "string" ? [c] : arr(c).filter((b) => b?.type === "text").map((b) => b.text);
          } else if (x?.type === "attachment" && x.attachment?.type === "queued_command") ts = [x.attachment.prompt];
          else if (x?.type === "system" && x.subtype === "local_command") ts = [x.content];
          // Queued "! cmd" and "/command args" arrive in their wrapper tags.
          for (const t of [...ts]) {
            if (typeof t !== "string") continue;
            const bash = tagText(t, "bash-input");
            if (bash !== undefined) ts.push(bash);
            const cmd = tagText(t, "command-name");
            if (cmd !== undefined) ts.push(`${cmd} ${tagText(t, "command-args") ?? ""}`);
          }
          const out = ts.filter((t) => typeof t === "string").map(normText);
          carried.set(j, out);
          return out;
        };
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          if (r?.type !== "queue-operation" || typeof r.content !== "string" || done.has(r)) continue;
          const key = normText(r.content);
          if (!key || QUEUE_MACHINE.test(key)) continue;
          let status = r.operation === "popAll" ? "returned" : "sent";
          for (let j = i + 1; j < rows.length && j <= i + QUEUE_LOOKAHEAD; j++) {
            const x = rows[j];
            if (x?.type === "queue-operation") {
              if (typeof x.content !== "string") continue;
              const k = normText(x.content);
              if (k === key) done.add(x); // the same message moving through the queue
              // popAll joins the queued messages; match whole ones, not a piece of a word
              else if (x.operation === "popAll" && ` ${k} `.includes(` ${key} `)) done.add(x);
              else continue;
              if (x.operation === "popAll") status = "returned";
            } else if (carrierTexts(j).includes(key)) {
              status = null; // delivered: that record shows it
              break;
            }
          }
          if (status) shown.set(r, status);
        }
        return shown;
      }

      function ruleTable(r) {
        const t = r?.type;
        if (t === "system") return [SYSTEM_RULES, r.subtype, r, "system"];
        if (t === "attachment") {
          const a = r.attachment && typeof r.attachment === "object" ? r.attachment : {};
          return [ATTACHMENT_RULES, a.type, a, "attachment"];
        }
        return [RECORD_RULES, t, r, typeof t === "string" ? t : "unknown"];
      }

      // Key of a record type that has no rule yet (shown as "? N new types"), else null.
      function missingRuleKey(r) {
        const [table, sub] = ruleTable(r);
        if (sub == null || typeof sub !== "string" || hasOwn(table, sub)) return null;
        return r.type === "system" || r.type === "attachment" ? `${r.type}:${sub}` : sub;
      }

      function describeRecord(r, idx = null) {
        const [table, sub, payload, defaultWho] = ruleTable(r);
        const rule = typeof sub === "string" && hasOwn(table, sub) ? table[sub] : null;
        const v = (f) => (typeof f === "function" ? f(payload, r, idx) : f);
        if (rule && v(rule.hide)) return { hide: true };
        if (rule?.track && idx?.stateSame.has(r)) return { hide: true };
        let body = rule ? v(rule.body) : undefined;
        let level = rule ? "known" : "recognized";
        if (body === undefined) {
          const text = renderedText(r) || typicalText(payload);
          if (text) body = text;
          else {
            body = { json: payload };
            if (!rule) level = "unknown";
          }
        }
        if (body === "") body = null;
        else if (body != null && typeof body !== "string" && !(typeof body === "object" && "json" in body))
          body = { json: body };
        let summary = rule ? v(rule.summary) : null;
        if (rule?.track && idx?.statePrev.has(r)) summary = `${clip(idx.statePrev.get(r)) || "—"} → ${summary ?? "—"}`;
        const icon = rule ? v(rule.icon) : null;
        const name = typeof sub === "string" ? sub : r?.type === "system" ? "system" : "?";
        return {
          level,
          kind: (rule && v(rule.kind)) || (r?.type === "system" ? "system" : "ui"),
          who: (rule && v(rule.who)) || defaultWho,
          tag: icon ? `${icon} ${name}` : name,
          summary: summary == null || summary === "" ? null : String(summary),
          body,
          md: !!(rule && v(rule.md)),
          prose: !!(rule && v(rule.prose)) && typeof body === "string",
          sensitive: !!rule?.sensitive,
          divider: !!rule?.divider,
          images: (rule && arr(v(rule.images))) || [],
        };
      }
      // ===== end rules =====

      async function parseFile(f) {
        const tri = newTriage();
        const name = f.name.toLowerCase();
        if (name.endsWith(".json") && !name.endsWith(".jsonl")) {
          const parsed = JSON.parse(await f.text());
          if (Array.isArray(parsed)) parsed.forEach((r) => triageRecord(tri, r));
          else if (parsed && typeof parsed === "object") triageRecord(tri, parsed);
          else throw new Error("JSON must be an array or object");
          return tri;
        }
        const reader = f.stream().pipeThrough(new TextDecoderStream()).getReader();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          let nl;
          while ((nl = buf.indexOf("\n")) >= 0) {
            triageLine(tri, buf.slice(0, nl));
            buf = buf.slice(nl + 1);
          }
        }
        triageLine(tri, buf);
        if (tri.bad) console.warn(`${tri.bad} bad lines skipped`);
        return tri;
      }

      // ===== rendering =====
      const CHUNK = 500;
      let state = { rows: [], idx: 0, fname: "", tri: null, index: null };

      function render(rows, fname, tri) {
        if (panel.open) panel.close(); // a new file (e.g. dropped over the modal) replaces the old
        chatEl.innerHTML = "";
        state = { rows, idx: 0, fname, tri };
        statsEl.title = "";
        if (!rows.length) {
          statsEl.textContent = tri?.apiReq
            ? `${fname} · ${L().apiLog(tri.apiReq, (tri.apiBytes / 1048576).toFixed(1))}`
            : "";
          chatEl.innerHTML = `<div class="empty">${L().emptyFile}</div>`;
          return;
        }
        const index = buildIndex(rows);
        const { firstTs, lastTs, nUser, nAsst, nService, newTypes } = computeStats(rows, index);
        const parts = [
          fname,
          `${rows.length} ${L().records} (${L().service(nService)})`,
          `${nUser}→ / ←${nAsst}`,
          `${fmtTime(firstTs)} → ${fmtTime(lastTs)}`,
        ];
        if (tri?.dups) parts.push(L().dups(tri.dups));
        if (tri?.apiReq) parts.push(L().apiLog(tri.apiReq, (tri.apiBytes / 1048576).toFixed(1)));
        // Types the rule tables don't know yet — the early signal of a format change.
        if (newTypes.length) parts.push(L().newTypes(newTypes.length));
        statsEl.textContent = parts.join(" · ");
        statsEl.title = newTypes.join("\n");
        state.index = index;
        renderChunk();
        applyFilters();
      }

      function renderChunk() {
        chatEl.querySelector(".load-more")?.remove();
        const end = Math.min(state.idx + CHUNK, state.rows.length);
        const frag = document.createDocumentFragment();
        for (let i = state.idx; i < end; i++) {
          let els;
          try {
            els = rowToEntries(state.rows[i]);
          } catch (err) {
            // One broken record must not kill the rest of the chunk.
            console.warn("render error at record", i, err);
            const row = state.rows[i];
            const dump = stringifyBounded(row);
            // A chat message that fails to render stays visible in its own bucket.
            const kind = row?.type === "user" || row?.type === "assistant" ? row.type : "ui";
            els = [
              entry(
                kind,
                "error",
                row?.timestamp,
                "⚠",
                svcDetails("render-error", "json", dump, "language-json"),
                truncSvc(dump),
              ),
            ];
          }
          for (const el of els) {
            recOf.set(el, state.rows[i]);
            frag.appendChild(el);
          }
        }
        chatEl.appendChild(frag);
        state.idx = end;
        if (state.idx < state.rows.length) {
          const left = state.rows.length - state.idx;
          const btn = document.createElement("button");
