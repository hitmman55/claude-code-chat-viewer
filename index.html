<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Code Chat Viewer</title>
    <meta
      name="description"
      content="Offline HTML viewer for Claude Code JSONL session transcripts. Six UI languages, light/dark theme, no backend, no CDN."
    />
    <meta
      name="keywords"
      content="claude code, claude, anthropic, jsonl, transcript viewer, chat log, log viewer, single file html"
    />
    <meta property="og:title" content="Claude Code Chat Viewer" />
    <meta
      property="og:description"
      content="Offline HTML viewer for Claude Code JSONL session transcripts."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script src="lib/marked.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --bg-2: #171c23;
        --bg-3: #202732;
        --border: #2a3340;
        --text: #d4d8de;
        --muted: #7a8494;
        --accent: #5fa8ff;
        --c-user: #5fa8ff;
        --c-assistant: #7ed39a;
        --c-thinking: #b892e0;
        --c-tool: #e0b467;
        --c-result: #7ac4e0;
        --c-meta: #d8b36a;
        --c-system: #7a8494;
        --c-error: #ff6b6b;
        --c-hook: #e08fb4;
        --pre-bg: #0b0f14;
        --code-bg: rgba(120, 140, 170, 0.15);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #ffffff;
        --bg-2: #f7f8fa;
        --bg-3: #edf0f4;
        --border: #d9dde3;
        --text: #1b1f24;
        --muted: #6b7280;
        --accent: #2563eb;
        --c-user: #2563eb;
        --c-assistant: #16a34a;
        --c-thinking: #7c3aed;
        --c-tool: #b45309;
        --c-result: #0891b2;
        --c-meta: #ca8a04;
        --c-system: #6b7280;
        --c-error: #dc2626;
        --c-hook: #be185d;
        --pre-bg: #f3f4f7;
        --code-bg: rgba(50, 60, 80, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.55 -apple-system,
          "Segoe UI",
          Roboto,
          Ubuntu,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--bg-2);
        border-bottom: 1px solid var(--border);
        padding: 12px 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      header input[type="file"],
      header select,
      header button {
        color: var(--text);
        background: var(--bg-3);
        border: 1px solid var(--border);
        padding: 6px 10px;
        border-radius: 6px;
        font: inherit;
      }
      header button {
        cursor: pointer;
      }
      header button:hover,
      header select:hover {
        border-color: var(--accent);
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        font-size: 13px;
        color: var(--muted);
      }
      .filters label {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .filters input {
        margin-inline-end: 4px;
        vertical-align: middle;
      }
      .filters .base {
        color: var(--muted);
        opacity: 0.55;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
      }
      #stats {
        flex-basis: 100%;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
      }

      .e {
        display: grid;
        grid-template-columns: 3px 1fr;
        gap: 12px;
        padding: 6px 0;
        min-width: 0;
        content-visibility: auto;
        contain-intrinsic-size: auto 80px;
      }
      .e::before {
        content: "";
        background: var(--bar);
        border-radius: 2px;
      }
      .e > .body {
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .e .hdr {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .e .hdr .who {
        color: var(--bar);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-inline-end: 8px;
      }
      .e .hdr .tag {
        background: var(--bg-3);
        padding: 1px 6px;
        border-radius: 3px;
        margin-inline-end: 6px;
        font-size: 10px;
      }
      .e .hdr .copy-btn,
      .e .hdr .full-btn {
        all: unset;
        cursor: pointer;
        display: inline-block;
        padding: 2px 6px;
        margin-inline-start: 6px;
        border-radius: 4px;
        font-size: 12px;
        line-height: 1.2;
        opacity: 0.55;
        transition:
          opacity 0.12s,
          background 0.12s;
      }
      .e:hover .copy-btn,
      .e:hover .full-btn {
        opacity: 0.85;
      }
      .e .copy-btn:hover,
      .e .full-btn:hover {
        opacity: 1;
        background: var(--bg-3);
      }
      .e .copy-btn:focus-visible,
      .e .full-btn:focus-visible {
        opacity: 1;
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .e .copy-btn.copied {
        opacity: 1;
        color: var(--c-assistant);
        background: var(--bg-3);
      }

      .e.user {
        --bar: var(--c-user);
      }
      .e.assistant {
        --bar: var(--c-assistant);
      }
      .e.thinking {
        --bar: var(--c-thinking);
      }
      .e.tool-use {
        --bar: var(--c-tool);
      }
      .e.tool-result {
        --bar: var(--c-result);
      }
      .e.tool-result.error {
        --bar: var(--c-error);
      }
      .e.meta {
        --bar: var(--c-meta);
      }
      .e.system {
        --bar: var(--c-system);
      }
      .e.ui {
        --bar: var(--c-system);
        opacity: 0.7;
      }
      .e.task-note {
        --bar: var(--c-meta);
      }
      .e.hook {
        --bar: var(--c-hook);
      }
      .e.system.error,
      .e.hook.error {
        --bar: var(--c-error);
      }
      .e.divider > .body {
        border-block-start: 1px dashed var(--c-system);
        padding-block-start: 6px;
      }
      .e .line {
        font-size: 12px;
        color: var(--muted);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      /* Full-text panel: one modal for any truncated entry; the feed keeps its heights. */
      #full-panel {
        width: min(1100px, 95vw);
        height: 90vh;
        max-width: none;
        max-height: none;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
      }
      #full-panel[open] {
        display: flex;
        flex-direction: column;
      }
      #full-panel::backdrop {
        background: rgba(0, 0, 0, 0.55);
      }
      .fp-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        border-block-end: 1px solid var(--border);
        background: var(--bg-2);
      }
      #fp-title {
        flex: 1 1 12em;
        min-width: 0;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fp-bar button {
        color: var(--text);
        background: var(--bg-3);
        border: 1px solid var(--border);
        padding: 4px 10px;
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .fp-bar button:hover:not(:disabled),
      .fp-bar button:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .fp-bar button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .fp-bar button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #fp-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 14px;
      }
      #fp-body > pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12.5px/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
      }

      .prose {
        font-size: 14px;
      }
      .prose p:first-child {
        margin-top: 0;
      }
      .prose p:last-child {
        margin-bottom: 0;
      }
      .prose pre {
        background: var(--pre-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        overflow-x: auto;
        font-size: 12.5px;
        line-height: 1.45;
        white-space: pre;
      }
      .prose code {
        background: var(--code-bg);
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 12.5px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .prose pre code {
        background: transparent;
        padding: 0;
      }
      .prose table {
        border-collapse: collapse;
        margin: 8px 0;
      }
      .prose th,
      .prose td {
        border: 1px solid var(--border);
        padding: 4px 10px;
      }
      .prose th {
        background: var(--bg-3);
      }
      .prose blockquote {
        border-inline-start: 3px solid var(--border);
        margin: 8px 0;
        padding-inline-start: 12px;
        color: var(--muted);
      }
      .prose a {
        color: var(--accent);
      }

      details.svc {
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg-2);
        min-width: 0;
        overflow: hidden;
      }
      details.svc > summary {
        padding: 4px 10px;
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
        user-select: none;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      details.svc[open] > summary {
        border-bottom: 1px solid var(--border);
      }
      details.svc > .content {
        padding: 8px 10px;
      }
      details.svc > .content > pre {
        margin: 0;
        background: var(--pre-bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        overflow-x: auto;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre;
      }
      details.svc > .content > pre code {
        background: transparent;
        padding: 0;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 60px 20px;
        font-size: 15px;
      }
      .kbd {
        background: var(--bg-3);
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 11px;
        font-family: ui-monospace, monospace;
        border: 1px solid var(--border);
      }
      .load-more {
        align-self: center;
        background: var(--bg-3);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        margin: 16px 0;
      }
      .load-more:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .demo-btn {
        background: var(--bg-3);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
      }
      .demo-btn:hover,
      .demo-btn:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
        outline: none;
      }

      body.drag-active #chat {
        outline: 3px dashed var(--accent);
        outline-offset: -8px;
        border-radius: 8px;
      }
      body.drag-active .empty {
        color: var(--accent);
      }

      /* Neutralized markdown image: no auto-fetch, just an inert label with URL */
      .md-image {
        display: inline-block;
        color: var(--muted);
        font-style: italic;
      }
      .md-image-url {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.9em;
        opacity: 0.8;
      }

      main.hide-thinking .e.thinking {
        display: none;
      }
      main.hide-tools .e.tool-use {
        display: none;
      }
      main.hide-results .e.tool-result {
        display: none;
      }
      main.hide-system .e.system,
      main.hide-system .e.meta,
      main.hide-system .e.task-note {
        display: none;
      }
      main.hide-ui .e.ui {
        display: none;
      }
      main.hide-hooks .e.hook {
        display: none;
      }
      main.reader-mode .e:not(.user):not(.assistant) {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <input type="file" id="file" accept=".jsonl,.json" />
      <div class="filters" id="filters">
        <label
          ><input type="checkbox" id="f-thinking" checked />
          <span class="f-label" data-k="thinking"></span
        ></label>
        <label
          ><input type="checkbox" id="f-tools" checked />
          <span class="f-label" data-k="tools"></span
        ></label>
        <label
          ><input type="checkbox" id="f-results" checked />
          <span class="f-label" data-k="results"></span
        ></label>
        <label
          ><input type="checkbox" id="f-system" /> <span class="f-label" data-k="system"></span
        ></label>
        <label
          ><input type="checkbox" id="f-hooks" /> <span class="f-label" data-k="hooks"></span
        ></label>
        <label><input type="checkbox" id="f-ui" /> <span class="f-label" data-k="ui"></span></label>
      </div>
      <label><input type="checkbox" id="reader-mode" /> <span id="reader-mode-label"></span></label>
      <select id="lang" title="Language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="zh">中文</option>
        <option value="ar">العربية</option>
      </select>
      <button id="theme" title="Theme"></button>
      <div id="stats"></div>
    </header>
    <main id="chat"><div class="empty" id="emptyState"></div></main>
    <dialog id="full-panel" aria-labelledby="fp-title">
      <div class="fp-bar">
        <span id="fp-title"></span>
        <button type="button" data-mode="text"></button>
        <button type="button" data-mode="md"></button>
        <button type="button" data-mode="json"></button>
        <button type="button" id="fp-copy"></button>
        <button type="button" id="fp-save"></button>
        <button type="button" id="fp-close"></button>
      </div>
      <div id="fp-body"></div>
    </dialog>

          dropFolderHint: "لا يدعم سحب المجلدات بعد — أسقط ملف .jsonl واحدًا.",
          usuallyAt: "عادةً في",
          reading: "جارٍ القراءة…",
          errRead: "خطأ في القراءة:",
          emptyFile: "ملف فارغ أو ليس JSONL.",
          records: "سجلات",
          service: (n) => `${n} خدمية`,
          dups: (n) => `مكررات محذوفة: ${n}`,
          apiLog: (n, mb) => `سجل API مخفي: ${n} طلبًا، ${mb} ميغابايت`,
          loadMore: (n, l) => `عرض ${n} أكثر (${l} متبقٍ)`,
          loading: "جارٍ التحميل…",
          cut: (n) => `تم قصّ ${n} حرفًا`,
          lines: (n) => `${n} سطرًا`,
          chars: (n) => `${n} حرفًا`,
          systemInject: "حقن النظام",
          readerMode: "وضع القراءة",
          openFull: "فتح كاملًا",
          modeText: "نص",
          modeMd: "Markdown",
          modeJson: "JSON السجل",
          copyAll: "نسخ الكل",
          saveFile: "حفظ الملف",
          close: "إغلاق",
          mdTooBig: "أكبر من أن يُعرض بـ Markdown — استخدم النص",
          newTypes: (n) => `? ${n} أنواع سجلات جديدة`,
          copy: "نسخ",
          copied: "تم النسخ!",
          tryExample: "جرّب مثالاً",
          filter: {
            thinking: "التفكير",
            tools: "الأدوات",
            results: "النتائج",
            system: "النظام / الميتا",
            hooks: "الخطافات",
            ui: "حالة الواجهة",
          },
        },
      };
      const DATE_LOCALES = {
        en: "en-US",
        ru: "ru-RU",
        es: "es-ES",
        fr: "fr-FR",
        zh: "zh-CN",
        ar: "ar-EG",
      };

      // localStorage can throw in strict privacy modes / third-party iframe contexts.
      const storage = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch {
            return null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch {}
        },
      };

      const savedLang = storage.get("lang");
      const browserLang = (navigator.language || "en").toLowerCase().split("-")[0];
      let locale = savedLang || (I18N[browserLang] ? browserLang : "en");
      const L = () => I18N[locale];

      function applyLocale() {
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
      }

      // ===== theme =====
      function applyTheme(theme) {
        if (theme === "light") document.documentElement.dataset.theme = "light";
        else delete document.documentElement.dataset.theme;
        themeBtn.textContent = theme === "light" ? "🌙" : "☀️";
      }

      // Resolve the effective theme: explicit user choice wins; otherwise follow OS.
      function preferredTheme() {
        const saved = storage.get("theme");
        if (saved === "light" || saved === "dark") return saved;
        return window.matchMedia?.("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }

      // ===== DOM refs =====
      const chatEl = document.getElementById("chat");
      const statsEl = document.getElementById("stats");
      const fileEl = document.getElementById("file");
      const emptyEl = document.getElementById("emptyState");
      const langSel = document.getElementById("lang");
      const themeBtn = document.getElementById("theme");

      const FILTERS = ["thinking", "tools", "results", "system", "hooks", "ui"];
      const fbox = Object.fromEntries(FILTERS.map((k) => [k, document.getElementById("f-" + k)]));
      Object.values(fbox).forEach((el) => el.addEventListener("change", applyFilters));
      const readerBox = document.getElementById("reader-mode");
      const readerLabel = document.getElementById("reader-mode-label");
      readerBox.addEventListener("change", () => {
        chatEl.classList.toggle("reader-mode", readerBox.checked);
        storage.set("readerMode", readerBox.checked ? "1" : "");
      });

      // Privacy: neutralize markdown images (no auto-fetch) and restrict link schemes.
      // Without this, [text](...) and ![alt](...) in transcripts would fetch remote
      // resources on render and leak viewer usage to whoever crafted the transcript.
      const mdRenderer = new marked.Renderer();
      // marked sees esc()-ed text, so href/title arrive with our entities; undo them
      // before validating and escaping once — otherwise "&" in a URL became "&amp;".
      const unesc = (s) =>
        String(s ?? "")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/&amp;/g, "&");
      mdRenderer.image = function (href, title, text) {
        const alt = esc(unesc(text || "image"));
        const url = href ? ` <span class="md-image-url">${esc(unesc(href))}</span>` : "";
        return `<span class="md-image">🖼️ ${alt}${url}</span>`;
      };
      mdRenderer.link = function (href, title, text) {
        // Only http(s) links are clickable; other schemes (javascript:, data:, file:, mailto:)
        // are rendered as plain text. `text` is already escaped/rendered by marked.
        const url = unesc(href);
        if (!url || !/^https?:\/\//i.test(url)) return text;
        const t = title ? ` title="${esc(unesc(title))}"` : "";
        return `<a href="${esc(url)}" rel="noopener noreferrer nofollow" target="_blank"${t}>${text}</a>`;
      };
      marked.setOptions({ renderer: mdRenderer, breaks: true, gfm: true });

      // ===== truncation =====
      const MAX_PROSE = 20_000;
      const MAX_SVC = 5_000;
      const cut = (s, max) =>
        !s ? "" : s.length <= max ? s : s.slice(0, max) + `\n\n… [${L().cut(s.length - max)}]`;
      const trunc = (s) => cut(s, MAX_PROSE);
      const truncSvc = (s) => cut(s, MAX_SVC);

      // ===== escaping & markdown =====
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const fmtTime = (iso) => {
        if (!iso || (typeof iso !== "string" && typeof iso !== "number")) return "";
        const d = new Date(iso);
        return isNaN(d.getTime()) ? "" : d.toLocaleString(DATE_LOCALES[locale], { hour12: false });
      };
      // XSS-safe: pre-escape HTML entities so marked only sees plain text with markdown syntax.
      // No raw HTML can reach innerHTML — no need for DOMPurify.
      // marked can overflow its stack on pathological input (thousands of nested list
      // markers) — fall back to escaped plain text so the entry keeps its place.
      const md = (txt) => {
        try {
          return marked.parse(esc(txt || ""));
        } catch {
          return `<pre>${esc(txt || "")}</pre>`;
        }
      };
      const preview = (s, n = 100) => {
        const p = s.slice(0, n).replace(/\s+/g, " ").trim();
        return esc(p) + (s.length > n ? "…" : "");
      };

      // ===== file loading =====
      async function loadFile(f) {
        // Clear stale stats from a previous file — on error the old stats row
        // would otherwise stay above the new error message and mislead the user.
        statsEl.textContent = "";
        chatEl.innerHTML = `<div class="empty">${L().reading}</div>`;
        try {
          const tri = await parseFile(f);
          render(tri.rows, f.name, tri);
        } catch (err) {
          chatEl.innerHTML = `<div class="empty">${L().errRead} ${esc(err.message)}</div>`;
        }
      }

      fileEl.addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (f) loadFile(f);
      });

      // ===== drag & drop =====
      // Enter-counter pattern: dragleave bubbles from children, so tracking a depth
      // counter avoids flickering the active class when hovering over nested elements.
      let dragDepth = 0;
      const hasFiles = (e) => e.dataTransfer?.types?.includes("Files");

      document.addEventListener("dragenter", (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        dragDepth++;
        document.body.classList.add("drag-active");
      });

      document.addEventListener("dragover", (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      });

      document.addEventListener("dragleave", (e) => {
        if (!hasFiles(e)) return;
        dragDepth--;
        if (dragDepth <= 0) {
          dragDepth = 0;
          document.body.classList.remove("drag-active");
        }
      });

      document.addEventListener("drop", async (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        dragDepth = 0;
        document.body.classList.remove("drag-active");

        // Copy items synchronously — DataTransferItemList goes dead after the handler.
        const items = Array.from(e.dataTransfer.items || []);
        const hasFolder = items.some((it) => it.webkitGetAsEntry?.()?.isDirectory);
        if (hasFolder) {
          chatEl.innerHTML = `<div class="empty">${L().dropFolderHint}</div>`;
          return;
        }

        const files = e.dataTransfer.files;
        if (!files.length) return;
        if (files.length > 1)
          console.warn(`Multiple files dropped; using first (${files[0].name})`);
        loadFile(files[0]);
      });

      // ===== triage =====
      // Line/record filtering and file-wide stats shared by every loader. DOM-free on
      // purpose: test/triage.test.mjs runs this section in Node, and the v0.2 indexer
      // can call it from a worker unchanged.

      // api-request* records (CLI 2.1.300+) are per-call API snapshots — system prompt,
      // tool schemas, user paths — up to half the file and not part of the conversation.
      // They are dropped before JSON.parse; "type" is always the first key.
      const API_LOG_PREFIX = '{"type":"api-request';
      const utf8 = new TextEncoder();
      const utf8Size = (s) => utf8.encode(s).length;

      function newTriage() {
        return { rows: [], byUuid: new Map(), bad: 0, dups: 0, apiReq: 0, apiBytes: 0 };
      }

      function triageLine(tri, ln) {
        if (!ln.trim()) return;
        if (ln.startsWith(API_LOG_PREFIX)) {
          tri.apiReq++;
          tri.apiBytes += utf8Size(ln);
          return;
        }
        let r;
        try {
          r = JSON.parse(ln);
        } catch {
          tri.bad++;
          return;
        }
        triageRecord(tri, r, ln);
      }

      // src: the raw line, when there is one — only used to size dropped API records.
      function triageRecord(tri, r, src = null) {
        if (typeof r?.type === "string" && r.type.startsWith("api-request")) {
          tri.apiReq++;
          tri.apiBytes += utf8Size(src ?? JSON.stringify(r));
          return;
        }
        // Resume/fork rewrites whole history segments with the same uuids (only slug,
        // forkedFrom, version, cwd differ): keep the first position, take the latest copy.
        const u = r?.uuid;
        if (u) {
          const i = tri.byUuid.get(u);
          if (i !== undefined) {
            tri.rows[i] = r;
            tri.dups++;
            return;
          }
          tri.byUuid.set(u, tri.rows.length);
        }
        tri.rows.push(r);
      }

      function computeStats(rows) {
        let firstTs,
          lastTs,
          nUser = 0,
          nAsstAnon = 0,
          nService = 0;
        // One API response is written as several lines (one per content block).
        const asstIds = new Set();
        const newTypes = new Set();
        for (const r of rows) {
          if (typeof r?.timestamp === "string" && r.timestamp) {
            firstTs ??= r.timestamp;
            lastTs = r.timestamp;
          }
          const t = r?.type;
          if (t === "user") {
            if (!r.isMeta && !r.toolUseResult && !r.isCompactSummary) nUser++;
          } else if (t === "assistant") {
            if (r.isApiErrorMessage) continue;
            const id = r.message?.id || r.uuid;
            if (id) asstIds.add(id);
            else nAsstAnon++; // hand-made files (demo.jsonl) carry no ids at all
          } else if (typeof t === "string" && t !== "system") nService++;
          if (t !== "user" && t !== "assistant" && r && typeof r === "object") {
            const k = missingRuleKey(r);
            if (k) newTypes.add(k);
          }
        }
        return {
          firstTs,
          lastTs,
          nUser,
          nAsst: asstIds.size + nAsstAnon,
          nService,
          newTypes: [...newTypes].sort(),
        };
      }
      // ===== end triage =====

      // ===== rules =====
      // Rule tables (registry) for service records. A rule is data: which filter bucket
      // (kind) a record goes to and how to summarize it. Rules never build HTML —
      // rowToEntries escapes everything it gets from here. A record without a rule is
      // "recognized" when it has rendered[] text or a typical text field, otherwise
      // "unknown" (JSON dump). The badge is the raw type name, so adding a rule needs
      // no translations. DOM-free like the triage section (see test/rules.test.mjs).
      // Rule fields (value or fn(payload, record)): icon, kind, who, summary, body
      // (undefined → default text, null → none, string, or { json }), md, hide,
      // prose (render like a chat message), sensitive (no preview), divider.

      const hasOwn = (o, k) => k != null && Object.prototype.hasOwnProperty.call(o, k);
      const arr = (x) => (Array.isArray(x) ? x : []);
      const clip = (s, n = 80) => {
        const p = String(s ?? "")
          .replace(/\s+/g, " ")
          .trim();
        return p.length > n ? p.slice(0, n) + "…" : p;
      };
      const fmtDur = (ms) => {
        if (typeof ms !== "number" || !isFinite(ms)) return "";
        if (ms < 1000) return `${Math.round(ms)}ms`;
        const sec = ms / 1000;
        if (sec < 60) return `${sec.toFixed(1)}s`;
        const m = Math.floor(sec / 60);
        if (m < 60) return `${m}m ${Math.round(sec % 60)}s`;
        return `${Math.floor(m / 60)}h ${m % 60}m`;
      };
      const fmtK = (n) =>
        typeof n !== "number" ? "?" : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n);
      const joinDot = (...xs) =>
        xs.filter((x) => x != null && x !== "" && x !== false && x !== 0).join(" · ");
      const textLines = (...xs) =>
        xs
          .flat()
          .filter((x) => x != null && x !== "")
          .map((x) => (typeof x === "string" ? x : JSON.stringify(x)))
          .join("\n");
      const baseName = (path) => String(path ?? "").split("/").pop();
      // Keys of a plain object only — a string here would yield one key per character.
      const objKeys = (o) => (o && typeof o === "object" && !Array.isArray(o) ? Object.keys(o) : []);

      const REMINDER_WRAP = /^<system-reminder>\n?([\s\S]*?)\n?<\/system-reminder>$/;
      // rendered[] (CLI 2.1.268+): the text the model actually saw for this record.
      function renderedText(r) {
        return arr(r?.rendered)
          .map((x) => (typeof x === "string" ? x : typeof x?.content === "string" ? x.content : ""))
          .map((t) => t.trim().replace(REMINDER_WRAP, "$1"))
          .filter(Boolean)
          .join("\n\n");
      }
      const TEXT_FIELDS = ["text", "content", "prompt", "snippet", "planContent", "banner", "message"];
      function typicalText(payload) {
        for (const k of TEXT_FIELDS) {
          const v = payload?.[k];
          if (typeof v === "string" && v.trim()) return v;
        }
        return "";
      }

      const HIDE = { hide: true };
      const hookName = (a) => a.hookName ?? a.hookEvent;
      const hookSummary = (a) =>
        joinDot(hookName(a), a.exitCode != null && `exit ${a.exitCode}`, fmtDur(a.durationMs));
      const LEVEL_ICON = { warning: "⚠", error: "❌" };

      const SYSTEM_RULES = {
        turn_duration: {
          icon: "⏱",
          summary: (r) =>
            joinDot(
              fmtDur(r.durationMs),
              r.messageCount != null && `${r.messageCount} msgs`,
              r.pendingBackgroundAgentCount && `${r.pendingBackgroundAgentCount} bg agents`,
            ),
          body: null,
        },
        stop_hook_summary: {
          icon: "🪝",
          kind: (r) => (arr(r.hookErrors).length || r.preventedContinuation ? "hook error" : "hook"),
          summary: (r) =>
            joinDot(
              `${r.hookCount ?? arr(r.hookInfos).length} hooks`,
              arr(r.hookErrors).length && `⚠ ${arr(r.hookErrors).length} errors`,
              r.preventedContinuation && "⛔ blocked",
              clip(r.stopReason, 60),
            ),
          body: (r) =>
            textLines(
              arr(r.hookInfos).map((h) => joinDot(h?.command ?? clip(h?.promptText, 120), fmtDur(h?.durationMs))),
              arr(r.hookErrors).map((e) => `⚠ ${typeof e === "string" ? e : JSON.stringify(e)}`),
            ),
        },
        away_summary: { icon: "📋", summary: (r) => clip(r.content, 100), md: true },
        local_command: { icon: "⚡", summary: (r) => commandSummary(r.content) },
        compact_boundary: {
          icon: "✂",
          divider: true,
          summary: (r) => {
            const m = r.compactMetadata ?? {};
            return joinDot(
              `compact (${m.trigger ?? "?"})`,
              m.preTokens != null &&
                (m.postTokens != null ? `${fmtK(m.preTokens)} → ${fmtK(m.postTokens)} tokens` : `${fmtK(m.preTokens)} tokens`),
              fmtDur(m.durationMs),
            );
          },
          body: (r) => ({ json: r.compactMetadata ?? r }),
        },
        model_refusal_fallback: {
          icon: "⚠",
          summary: (r) => joinDot(`${r.originalModel ?? "?"} → ${r.fallbackModel ?? "?"}`, r.apiRefusalCategory),
        },
        model_refusal_no_fallback: {
          icon: "⛔",
          kind: "system error",
          summary: (r) => joinDot(r.originalModel, r.apiRefusalCategory),
          body: (r) => r.apiRefusalExplanation || r.content || undefined,
        },
        api_error: {
          icon: "❌",
          kind: "system error",
          summary: (r) => {
            const e = r.error;
            const msg = e?.error?.error?.message ?? e?.error?.message ?? e?.message;
            return joinDot(
              "API error",
              e?.status,
              clip(msg, 80),
              r.retryAttempt != null && `retry ${r.retryAttempt}/${r.maxRetries ?? "?"}`,
              fmtDur(r.retryInMs),
            );
          },
          body: (r) => ({ json: r.error ?? r }),
        },
        informational: {
          icon: (r) => (hasOwn(LEVEL_ICON, r.level) ? LEVEL_ICON[r.level] : "ℹ"),
          kind: (r) => (r.level === "error" ? "system error" : "system"),
          summary: (r) => clip(r.content, 120),
          body: (r) => (typeof r.content === "string" && r.content.length > 120 ? r.content : null),
        },
        scheduled_task_fire: { icon: "⏰", summary: (r) => joinDot(clip(r.content, 100), r.cron), body: null },
      };

      function commandSummary(content) {
        const s = typeof content === "string" ? content : "";
        // indexOf, not a lazy regex: a wall of unclosed tags made the regex quadratic.
        const pick = (tag) => {
          const open = `<${tag}>`;
          const i = s.indexOf(open);
          if (i < 0) return undefined;
          const j = s.indexOf(`</${tag}>`, i + open.length);
          return j < 0 ? undefined : s.slice(i + open.length, j).trim();
        };
        const name = pick("command-name");
        if (name) return joinDot(name, clip(pick("command-args"), 60));
        const out = pick("local-command-stdout");
        if (out != null) return `stdout · ${clip(out, 80)}`;
        return clip(s, 100);
      }

      const ATTACHMENT_RULES = {
        // Typed while the agent was busy: human prompts are real user messages,
        // task notifications are machine messages (owner decision 2026-08-24).
        queued_command: {
          icon: "⏳",
          kind: (a) => (a.commandMode === "prompt" ? "user" : "task-note"),
          who: (a) => (a.commandMode === "prompt" ? "user" : "task"),
          prose: (a) => a.commandMode === "prompt",
          summary: (a) => clip(a.prompt, 90),
          body: (a) => (typeof a.prompt === "string" ? a.prompt : undefined),
          md: true,
        },
        hook_success: {
          icon: "🪝",
          kind: "hook",
          summary: hookSummary,
          body: (a) => textLines(a.stdout, a.stderr, a.content),
        },
        hook_non_blocking_error: {
          icon: "🪝",
          kind: "hook error",
          summary: hookSummary,
          body: (a) => textLines(a.stderr, a.stdout, a.command && `command: ${a.command}`),
        },
        hook_blocking_error: {
          icon: "⛔",
          kind: "hook error",
          summary: (a) => joinDot(hookName(a), clip(a.blockingError?.blockingError, 80)),
          body: (a) =>
            textLines(a.blockingError?.blockingError, a.blockingError?.command && `command: ${a.blockingError.command}`),
        },
        hook_cancelled: {
          icon: "⏱",
          kind: "hook error",
          summary: (a) =>
            joinDot(hookName(a), a.timedOut ? `timeout ${fmtDur(a.timeoutMs)}` : "cancelled", fmtDur(a.durationMs)),
          body: (a) => a.command ?? null,
        },
        hook_additional_context: {
          icon: "🪝",
          kind: "hook",
          summary: (a) => joinDot(hookName(a), clip(textLines(a.content), 80)),
          body: (a) => textLines(a.content) || undefined,
        },
        hook_system_message: {
          icon: "🪝",
          kind: "hook",
          summary: (a) => joinDot(hookName(a), clip(a.content, 80)),
        },
        file: {
          icon: "📄",
          summary: (a) =>
            joinDot(a.displayPath ?? a.filename, a.content?.file?.numLines != null && `${a.content.file.numLines} lines`),
          body: (a) => a.content?.file?.content,
        },
        edited_text_file: { icon: "✏️", summary: (a) => a.displayPath ?? a.filename },
        directory: { icon: "📁", summary: (a) => a.displayPath ?? a.path },
        compact_file_reference: { icon: "📄", summary: (a) => a.displayPath ?? a.filename, body: null },
        invoked_skills: {
          icon: "⭐",
          summary: (a) =>
            arr(a.skills)
              .map((x) => x?.name)
              .filter(Boolean)
              .join(", "),
          body: (a) => arr(a.skills).map((x) => `# ${x?.name ?? "?"}\n\n${x?.content ?? ""}`).join("\n\n") || undefined,
          md: true,
        },
        nested_memory: {
          icon: "🧠",
          summary: (a) => a.displayPath ?? a.path,
          body: (a) => a.content?.content,
          md: true,
        },
        plan_file_reference: { icon: "📝", summary: (a) => baseName(a.planFilePath), body: (a) => a.planContent, md: true },
        plan_mode: { icon: "📝", kind: "system", summary: (a) => joinDot("plan mode", baseName(a.planFilePath)), body: null },
        plan_mode_exit: {
          icon: "📝",
          kind: "system",
          summary: (a) => joinDot("plan mode exit", baseName(a.planFilePath)),
          body: null,
        },
        plan_mode_reentry: {
          icon: "📝",
          kind: "system",
          summary: (a) => joinDot("plan mode re-entry", baseName(a.planFilePath)),
          body: null,
        },
        // Sensitive: CLAUDE.md files, system prompt, e-mail, paths. Summary carries
        // counts only, so a screenshot of the collapsed feed leaks nothing.
        instructions: {
          icon: "📜",
          sensitive: true,
          summary: (a) => `${arr(a.files).length} files`,
          body: (a) => arr(a.files).map((f) => joinDot(f?.type, f?.path)).join("\n") || undefined,
        },
        prompt_snapshot: {
          icon: "🧾",
          sensitive: true,
          summary: (a) => `${arr(a.systemPrompt).length} parts`,
          body: (a) => arr(a.systemPrompt).filter((x) => typeof x === "string").join("\n\n---\n\n") || undefined,
        },
        session_context: {
          icon: "🔒",
          sensitive: true,
          summary: (a) => objKeys(a.context).join(", "),
        },
        environment: {
          icon: "🖥",
          sensitive: true,
          summary: (a) => joinDot(a.snapshot?.platform, a.snapshot?.shell),
        },
        credential_org: HIDE,
        total_tokens_reminder: HIDE,
        model: { icon: "🤖", summary: (a) => a.identity?.modelId ?? clip(a.text), body: null },
        date: { icon: "📅", summary: (a) => a.date, body: null },
        date_change: { icon: "📅", kind: "system", summary: (a) => joinDot("date change", a.newDate), body: null },
        language: { icon: "🌐", summary: (a) => a.language, body: null },
        diagnostics: {
          icon: "🩺",
          summary: (a) =>
            joinDot(
              `${arr(a.files).length} files`,
              `${arr(a.files).reduce((n, f) => n + arr(f?.diagnostics).length, 0)} issues`,
            ),
          body: (a) =>
            arr(a.files)
              .flatMap((f) =>
                arr(f?.diagnostics).map(
                  (d) =>
                    `${baseName(f?.uri)}:${(d?.range?.start?.line ?? 0) + 1} ${d?.severity ?? ""} ${d?.message ?? ""}`,

              .join("\n") || undefined,
        },
        deferred_tools_delta: {
          icon: "🔧",
          summary: (a) =>
            joinDot(arr(a.addedNames).length && `+${arr(a.addedNames).length}`, arr(a.removedNames).length && `−${arr(a.removedNames).length}`),
        },
        deferred_tools_record: {
          icon: "🔧",
          summary: (a) => `${arr(a.entries).length} tools`,
          body: (a) =>
            arr(a.entries)
              .map((e) => e?.name)
              .filter(Boolean)
              .join("\n") || undefined,
        },
        mcp_instructions_delta: { icon: "🔌", summary: (a) => arr(a.addedNames).join(", ") },
        agent_listing_delta: { icon: "🤖", summary: (a) => `${arr(a.addedTypes).length} agent types` },
        skill_listing: { icon: "⭐", summary: (a) => `${a.skillCount ?? arr(a.names).length} skills` },
        command_permissions: {
          icon: "🔐",
          summary: (a) => `${arr(a.allowedTools).length} allowed`,
          body: (a) => textLines(a.allowedTools) || null,
        },
        task_reminder: {
          icon: "☑️",
          hide: (a) => !a.itemCount,
          summary: (a) => `${a.itemCount} tasks`,
          body: (a) => ({ json: a.content ?? a }),
        },
        task_status: {
          icon: "🤖",
          kind: "task-note",
          who: "task",
          summary: (a) => joinDot(a.description, a.status),
          body: (a) => a.deltaSummary ?? null,
        },
        auto_mode: { icon: "🤖", summary: "auto mode" },
        auto_mode_exit: { icon: "🤖", summary: "auto mode exit" },
        ultrathink_effort: { icon: "🧠", summary: (a) => a.level, body: null },
        ultra_effort_enter: { icon: "🧠" },
        workflow_keyword_request: { icon: "🔀" },
        silent_turn_reminder: { icon: "💬" },
        bash_output_audience_note: { icon: "💬" },
        batching_reminder_sent: { icon: "💬" },
        read_truncation_notice: { icon: "✂", summary: (a) => clip(a.banner, 100), body: null },
        remote_session_change: { icon: "🔗" },
        session_cron_carry: { icon: "⏰", summary: (a) => clip(a.wakeup?.reason, 80), body: (a) => ({ json: a }) },
        thinking_drop: {
          icon: "💭",
          summary: (a) =>
            joinDot(a.newlyDropped?.reason, a.newlyDropped?.blockCount != null && `${a.newlyDropped.blockCount} blocks`),
          body: (a) => ({ json: a }),
        },
        structured_output: { icon: "🧩", kind: "task-note", who: "task", body: (a) => ({ json: a.data ?? a }) },
        dynamic_skill: { icon: "⭐", summary: (a) => arr(a.skillNames).join(", "), body: null },
        goal_status: {
          icon: "🎯",
          kind: "system",
          summary: (a) => joinDot(a.met ? "✅ met" : "⏳ not met", clip(a.condition, 80)),
          body: (a) => a.reason ?? null,
        },
      };

      const RECORD_RULES = {
        mode: HIDE,
        "atis-latch": HIDE,
        "last-prompt": HIDE,
        "agent-setting": HIDE,
        "custom-title": { icon: "🏷", summary: (r) => r.customTitle, body: null },
        "ai-title": { icon: "🏷", summary: (r) => r.aiTitle, body: null },
        "agent-name": { icon: "🏷", summary: (r) => r.agentName, body: null },
        "permission-mode": { icon: "🔐", summary: (r) => r.permissionMode, body: null },
        "queue-operation": {
          icon: "⏳",
          summary: (r) => joinDot(r.operation, clip(r.content, 80)),
          body: (r) => (typeof r.content === "string" ? r.content : null),
        },
        "file-history-snapshot": {
          icon: "💾",
          summary: (r) => `${objKeys(r.snapshot?.trackedFileBackups).length} files`,
          body: null,
        },
        "file-history-delta": { icon: "💾", summary: (r) => r.trackingPath, body: null },
        "pr-link": {
          icon: "🔗",
          kind: "system",
          summary: (r) => joinDot(r.prRepository, r.prNumber != null && `#${r.prNumber}`),
          body: (r) => (typeof r.prUrl === "string" ? r.prUrl : null),
          md: true,
        },
        "fork-context-ref": { icon: "🍴", kind: "system", summary: (r) => r.parentSessionId, body: null },
        progress: { icon: "⏳", summary: (r) => r.data?.type, body: (r) => ({ json: r.data ?? r }) },
        "cost-state": {
          icon: "💲",
          kind: "system",
          summary: (r) =>
            joinDot(
              typeof r.totalCostUSD === "number" && `$${r.totalCostUSD.toFixed(2)}`,
              fmtDur(r.totalDuration),
              r.totalLinesAdded != null && `+${r.totalLinesAdded} −${r.totalLinesRemoved ?? 0}`,
            ),
          body: (r) => ({ json: r.modelUsage ?? r }),
        },
        "frame-link": {
          icon: "🖼",
          summary: (r) => r.title ?? baseName(r.path),
          body: (r) => (typeof r.frameUrl === "string" ? r.frameUrl : null),
          md: true,
        },
        "continued-in": { icon: "➡", kind: "system", summary: (r) => r.continuedInSessionId, body: null },
        relocated: { icon: "📂", kind: "system", summary: (r) => r.relocatedCwd, body: null },
        "worktree-state": {
          icon: "🌿",
          kind: "system",
          summary: (r) => joinDot(r.worktreeSession?.worktreeName, r.worktreeSession?.worktreeBranch),
          body: (r) => ({ json: r.worktreeSession ?? r }),
        },
        summary: { icon: "📋", kind: "system", summary: (r) => clip(r.summary, 100), body: (r) => r.summary },
        // workflow journals (subagents/workflows/wf_*)
        launched: { icon: "🔀", body: null },
        started: { icon: "🔀", summary: (r) => joinDot(r.label, r.phase), body: null },
        result: { icon: "🔀", summary: (r) => clip(r.result?.scenario ?? r.agentId), body: (r) => ({ json: r.result ?? r }) },
      };

      // Tool calls that are really messages, not tool use.
      const TOOL_RULES = {
        // CLI 2.1.271+: a subagent's final report travels in this call's input.
        SubagentHandback: { kind: "assistant", who: "handback", body: (i) => i?.message },
      };

      function describeTool(b) {
        if (!hasOwn(TOOL_RULES, b?.name)) return null;
        const rule = TOOL_RULES[b.name];
        const body = rule.body(b.input);
        if (typeof body !== "string" || !body.trim()) return null; // generic tool card instead
        return { prose: true, kind: rule.kind, who: rule.who, tag: `↩ ${b.name}`, body, md: true };
      }

      function ruleTable(r) {
        const t = r?.type;
        if (t === "system") return [SYSTEM_RULES, r.subtype, r, "system"];
        if (t === "attachment") {
          const a = r.attachment && typeof r.attachment === "object" ? r.attachment : {};
          return [ATTACHMENT_RULES, a.type, a, "attachment"];
        }
        return [RECORD_RULES, t, r, typeof t === "string" ? t : "unknown"];
      }

      // Key of a record type that has no rule yet (shown as "? N new types"), else null.
      function missingRuleKey(r) {
        const [table, sub] = ruleTable(r);
        if (sub == null || typeof sub !== "string" || hasOwn(table, sub)) return null;
        return r.type === "system" || r.type === "attachment" ? `${r.type}:${sub}` : sub;
      }

      function describeRecord(r) {
        const [table, sub, payload, defaultWho] = ruleTable(r);
        const rule = typeof sub === "string" && hasOwn(table, sub) ? table[sub] : null;
        const v = (f) => (typeof f === "function" ? f(payload, r) : f);
        if (rule && v(rule.hide)) return { hide: true };
        let body = rule ? v(rule.body) : undefined;
        let level = rule ? "known" : "recognized";
        if (body === undefined) {
          const text = renderedText(r) || typicalText(payload);
          if (text) body = text;
          else {
            body = { json: payload };
            if (!rule) level = "unknown";
          }
        }
        if (body === "") body = null;
        else if (body != null && typeof body !== "string" && !(typeof body === "object" && "json" in body))
          body = { json: body };
        const summary = rule ? v(rule.summary) : null;
        const icon = rule ? v(rule.icon) : null;
        const name = typeof sub === "string" ? sub : r?.type === "system" ? "system" : "?";
        return {
          level,
          kind: (rule && v(rule.kind)) || (r?.type === "system" ? "system" : "ui"),
          who: (rule && v(rule.who)) || defaultWho,
          tag: icon ? `${icon} ${name}` : name,
          summary: summary == null || summary === "" ? null : String(summary),
          body,
          md: !!(rule && v(rule.md)),
          prose: !!(rule && v(rule.prose)) && typeof body === "string",
          sensitive: !!rule?.sensitive,
          divider: !!rule?.divider,
        };
      }
      // ===== end rules =====

      async function parseFile(f) {
        const tri = newTriage();
        const name = f.name.toLowerCase();
        if (name.endsWith(".json") && !name.endsWith(".jsonl")) {
          const parsed = JSON.parse(await f.text());
          if (Array.isArray(parsed)) parsed.forEach((r) => triageRecord(tri, r));
          else if (parsed && typeof parsed === "object") triageRecord(tri, parsed);
          else throw new Error("JSON must be an array or object");
          return tri;
        }
        const reader = f.stream().pipeThrough(new TextDecoderStream()).getReader();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          let nl;
          while ((nl = buf.indexOf("\n")) >= 0) {
            triageLine(tri, buf.slice(0, nl));
            buf = buf.slice(nl + 1);
          }
        }
        triageLine(tri, buf);
        if (tri.bad) console.warn(`${tri.bad} bad lines skipped`);
        return tri;
      }

      // ===== rendering =====
      const CHUNK = 500;
      let state = { rows: [], idx: 0, fname: "", tri: null };

      function render(rows, fname, tri) {
        if (panel.open) panel.close(); // a new file (e.g. dropped over the modal) replaces the old
        chatEl.innerHTML = "";
        state = { rows, idx: 0, fname, tri };
        statsEl.title = "";
        if (!rows.length) {
          statsEl.textContent = tri?.apiReq
            ? `${fname} · ${L().apiLog(tri.apiReq, (tri.apiBytes / 1048576).toFixed(1))}`
            : "";
          chatEl.innerHTML = `<div class="empty">${L().emptyFile}</div>`;
          return;
        }
        const { firstTs, lastTs, nUser, nAsst, nService, newTypes } = computeStats(rows);
        const parts = [
          fname,
          `${rows.length} ${L().records} (${L().service(nService)})`,
          `${nUser}→ / ←${nAsst}`,
          `${fmtTime(firstTs)} → ${fmtTime(lastTs)}`,
        ];
        if (tri?.dups) parts.push(L().dups(tri.dups));
        if (tri?.apiReq) parts.push(L().apiLog(tri.apiReq, (tri.apiBytes / 1048576).toFixed(1)));
        // Types the rule tables don't know yet — the early signal of a format change.
        if (newTypes.length) parts.push(L().newTypes(newTypes.length));
        statsEl.textContent = parts.join(" · ");
        statsEl.title = newTypes.join("\n");
        renderChunk();
        applyFilters();
      }

      function renderChunk() {
        chatEl.querySelector(".load-more")?.remove();
        const end = Math.min(state.idx + CHUNK, state.rows.length);
        const frag = document.createDocumentFragment();
        for (let i = state.idx; i < end; i++) {
          let els;
          try {
            els = rowToEntries(state.rows[i]);
          } catch (err) {
            // One broken record must not kill the rest of the chunk.
            console.warn("render error at record", i, err);
            const row = state.rows[i];
            const dump = stringifyBounded(row);
            // A chat message that fails to render stays visible in its own bucket.
            const kind = row?.type === "user" || row?.type === "assistant" ? row.type : "ui";
            els = [
              entry(
                kind,
                "error",
                row?.timestamp,
                "⚠",
                svcDetails("render-error", "json", dump, "language-json"),
                truncSvc(dump),
              ),
            ];
          }
          for (const el of els) {
            recOf.set(el, state.rows[i]);
            frag.appendChild(el);
          }
        }
        chatEl.appendChild(frag);
        state.idx = end;
        if (state.idx < state.rows.length) {
          const left = state.rows.length - state.idx;
          const btn = document.createElement("button");
          btn.className = "load-more";
          btn.textContent = L().loadMore(Math.min(CHUNK, left), left);
          btn.onclick = () => {
            btn.disabled = true;
            btn.textContent = L().loading;
            requestAnimationFrame(renderChunk);
          };
          chatEl.appendChild(btn);
        }
      }

      // One row may produce multiple entries (e.g. assistant with thinking + tool_use).
      function rowToEntries(r) {
        const t = r.type;
        const ts = r.timestamp;

        if (t === "user") return userEntries(r, ts);
        if (t === "assistant") return assistantEntries(r, ts);
        // Everything else (system, attachment, state records, unknown) goes through
        // the rule tables.
        const spec = describeRecord(r);
        return spec.hide ? [] : [specEntry(spec, ts)];
      }

      function specEntry(s, ts) {
        const isJson = s.body != null && typeof s.body === "object";
        const cut = { hit: false };
        const bodyText = s.body == null ? "" : isJson ? stringifyBounded(s.body.json, cut) : s.body;
        const full = isJson ? () => jsonFull(s.body.json) : () => s.body;
        if (s.prose) {
          const shown = trunc(bodyText);
          const html = `<div class="prose">${md(shown)}</div>`;
          return entry(s.kind, s.who, ts, s.tag, html, shown, bodyText.length > MAX_PROSE ? full : null);
        }
        const summary =
          s.summary != null
            ? esc(s.summary)
            : s.sensitive
              ? esc(L().chars(bodyText.length))
              : `${L().chars(bodyText.length)} · ${preview(bodyText, 80)}`;
        const html =
          s.body == null
            ? `<div class="line">${summary}</div>`
            : svcDetails("rule", summary, bodyText, isJson ? "language-json" : null, s.md);
        const truncated = cut.hit || bodyText.length > MAX_SVC;
        return entry(
          s.kind + (s.divider ? " divider" : ""),
          s.who,
          ts,
          s.tag,
          html,
          truncSvc(bodyText || s.summary || ""),
          truncated ? full : null,
        );
      }

      function userEntries(r, ts) {
        const c = r.message?.content;
        const isMeta = r.isMeta === true;

        if (typeof c === "string") {
          if (isMeta) return [metaEntry(c, ts, L().systemInject)];
          if (c.startsWith("<task-notification>")) return [taskNoteEntry(c, ts)];
          return [proseEntry("user", "user", ts, c)];
        }

        if (!Array.isArray(c)) return [];
        const out = [];
        for (const b of c) {
          if (b.type === "tool_result") {
            out.push(toolResultEntry(b, ts));
          } else if (b.type === "text" && (b.text || "").trim()) {
            out.push(
              isMeta
                ? metaEntry(b.text, ts, L().systemInject)
                : proseEntry("user", "user", ts, b.text),
            );
          }
        }
        return out;
      }

      function assistantEntries(r, ts) {
        const c = r.message?.content;
        if (typeof c === "string") {
          return c.trim() ? [proseEntry("assistant", "claude", ts, c)] : [];
        }
        if (!Array.isArray(c)) return [];
        const out = [];
        for (const b of c) {
          if (b.type === "text" && (b.text || "").trim()) {
            out.push(proseEntry("assistant", "claude", ts, b.text));
          } else if (b.type === "thinking" && (b.thinking || "").trim()) {
            const th = b.thinking;
            out.push(
              entry(
                "thinking",
                "thinking",
                ts,
                "💭",
                svcDetails("thinking", L().chars(th.length), th, null, true),
                truncSvc(th),
                th.length > MAX_SVC ? () => th : null,
              ),
            );
          } else if (b.type === "tool_use") {
            const spec = describeTool(b);
            out.push(spec ? specEntry(spec, ts) : toolUseEntry(b, ts));
          }
        }
        return out;
      }

      // Per-entry raw text for Copy. WeakMap so entries are GC'd when removed from DOM.
      // Text is always already-truncated (trunc / truncSvc done by callers) — Copy
      // never deals with megabyte content, so clipboard.writeText stays fast and
      // neither the site nor the browser can choke on huge payloads.
      const copyTexts = new WeakMap();
      // Entries cut for display get a ⤢ button: entry element → () => untruncated text,
      // built only when the panel opens. recOf: entry element → its source record.
      const fullTexts = new WeakMap();
      const recOf = new WeakMap();

      function entry(kind, who, ts, tag, innerHTML, copyText = null, full = null) {
        const el = document.createElement("div");
        el.className = "e " + kind;
        const tagHTML = tag ? `<span class="tag">${esc(tag)}</span>` : "";
        const timeHTML = ts ? `<span>${fmtTime(ts)}</span>` : "";
        const copyBtn =
          copyText != null && copyText !== ""
            ? `<button class="copy-btn" title="${esc(L().copy)}" aria-label="${esc(L().copy)}">📋</button>`
            : "";
        const fullBtn = full
          ? `<button class="full-btn" title="${esc(L().openFull)}" aria-label="${esc(L().openFull)}">⤢</button>`
          : "";
        el.innerHTML =
          `<div class="body">` +
          `<div class="hdr"><span class="who">${esc(who)}</span>${tagHTML}${timeHTML}${copyBtn}${fullBtn}</div>` +
          innerHTML +
          `</div>`;
        if (copyText != null && copyText !== "") copyTexts.set(el, copyText);
        if (full) fullTexts.set(el, full);
        return el;
      }

      async function copyToClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          // Fallback for non-secure contexts (file://) and older browsers.
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.top = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try {
            ok = document.execCommand("copy");
          } catch {}
          document.body.removeChild(ta);
          return ok;
        }
      }

      // Delegated click listener — one for all entries, O(1) memory regardless of count.
      chatEl.addEventListener("click", async (e) => {
        const fb = e.target.closest(".full-btn");
        if (fb && chatEl.contains(fb)) {
          e.preventDefault();
          openPanel(fb.closest(".e"), fb);
          return;
        }
        const btn = e.target.closest(".copy-btn");
        if (!btn || !chatEl.contains(btn)) return;
        e.preventDefault();
        const entryEl = btn.closest(".e");
        if (!entryEl) return;
        const text = copyTexts.get(entryEl);
        if (!text) return;
        const ok = await copyToClipboard(text);
        if (!ok) return;
        const prev = btn.textContent;
        btn.textContent = "✓";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = prev;
          btn.classList.remove("copied");
        }, 1200);
      });

      function proseEntry(kind, who, ts, text) {
        const shown = trunc(text);
        const full = text.length > MAX_PROSE ? () => text : null;
        return entry(kind, who, ts, null, `<div class="prose">${md(shown)}</div>`, shown, full);
      }

      function metaEntry(text, ts, tag) {
        const shown = truncSvc(text);
        const html = svcDetails(
          "meta",
          `${L().chars(text.length)} · ${preview(text, 80)}`,
          text,
          null,
          true,
        );
        return entry("meta", "inject", ts, tag, html, shown, text.length > MAX_SVC ? () => text : null);
      }

      function taskNoteEntry(text, ts) {
        // <task-notification> blob from subagents — shown as service, with markdown inside
        const shown = truncSvc(text);
        const html = svcDetails("task", preview(text, 90), text, null, true);
        return entry("task-note", "task", ts, "📣", html, shown, text.length > MAX_SVC ? () => text : null);
      }

      // Known Claude Code tools get friendly label + emoji. Unknown (e.g. MCP tools
      // prefixed with mcp__) fall back to raw name with a generic wrench.
      const TOOL_LABELS = {
        Read: "📖 Read file",
        Write: "✏️ Write file",
        Edit: "📝 Edit file",
        MultiEdit: "📝 Multi-edit",
        NotebookEdit: "📓 Notebook edit",
        Bash: "🖥️ Shell",
        Glob: "🔎 Find files",
        Grep: "🔍 Search code",
        WebFetch: "🌐 Fetch URL",
        WebSearch: "🔍 Web search",
        Task: "🤖 Subagent",
        Agent: "🤖 Subagent",
        TodoWrite: "☑️ Update todos",
        Skill: "⭐ Skill",
        SlashCommand: "⚡ Slash command",
        ToolSearch: "🔎 Tool search",
        SendMessage: "✉️ Message agent",
        AskUserQuestion: "❓ Ask user",
        ScheduleWakeup: "⏰ Schedule wakeup",
        ListAgents: "🤖 List agents",
        TaskCreate: "☑️ Create task",
        TaskUpdate: "☑️ Update task",
        TaskStop: "⏹ Stop task",
        TaskOutput: "📤 Task output",
        StructuredOutput: "🧩 Structured output",
        CronCreate: "⏰ Create cron",
        CronDelete: "⏰ Delete cron",
        EnterPlanMode: "📝 Enter plan mode",
        ExitPlanMode: "📝 Exit plan mode",
        EnterWorktree: "🌿 Enter worktree",
        ExitWorktree: "🌿 Exit worktree",
        Workflow: "🔀 Workflow",
        Artifact: "🖼 Artifact",
        Monitor: "👁 Monitor",
      };
      const friendlyToolName = (name) => (hasOwn(TOOL_LABELS, name) ? TOOL_LABELS[name] : `🔧 ${name}`);

      function toolUseEntry(b, ts) {
        const name = b.name || "tool";
        const cut = { hit: false };
        const inputStr = b.input ? stringifyBounded(b.input, cut) : "";
        const hint =
          b.input && typeof b.input === "object"
            ? Object.entries(b.input)
                .slice(0, 2)
                .map(([k, v]) => {
                  // JSON.stringify(undefined) returns undefined, not a string
                  const s =
                    v === undefined ? "undefined" : typeof v === "string" ? v : JSON.stringify(v);
                  return `${k}=${s.length > 40 ? s.slice(0, 40) + "…" : s}`;
                })
                .join(" · ")
            : "";
        const summary = `${esc(friendlyToolName(name))}${hint ? " · " + esc(hint) : ""}`;
        const html = svcDetails("tool-use", summary, inputStr, "language-json");
        const full = cut.hit || inputStr.length > MAX_SVC ? () => jsonFull(b.input) : null;
        return entry("tool-use", name, ts, "tool", html, truncSvc(inputStr), full);
      }

      function toolResultEntry(b, ts) {
        const raw = b.content ?? ""; // tool_result may lack content entirely
        let text = "";
        let full;
        const cut = { hit: false };
        if (typeof raw === "string") {
          text = raw;
          full = () => raw;
        } else if (Array.isArray(raw)) {
          text = joinBounded(raw, cut);
          full = () =>
            raw
              .filter((x) => x != null)
              .map((x) => (typeof x === "string" ? x : x.text || jsonFull(x)))
              .join("\n");
        } else {
          text = stringifyBounded(raw, cut);
          full = () => jsonFull(raw);
        }
        const err = !!b.is_error;
        const lineCount = (text.match(/\n/g)?.length ?? 0) + 1;
        const summary = `${err ? "❌" : "📤"} result · ${L().lines(lineCount)} · ${L().chars(text.length)} · ${preview(text, 100)}`;
        const html = svcDetails(err ? "tool-result-err" : "tool-result", summary, text);
        return entry(
          "tool-result" + (err ? " error" : ""),
          "result",
          ts,
          "result",
          html,
          truncSvc(text),
          cut.hit || text.length > MAX_SVC ? full : null,
        );
      }

      // summaryRaw is pre-built HTML; callers must escape untrusted pieces.
      function svcDetails(cls, summaryRaw, bodyText, codeClass = null, asMarkdown = false) {
        const shown = truncSvc(bodyText || "");
        const body = asMarkdown
          ? `<div class="prose">${md(shown)}</div>`
          : `<pre><code${codeClass ? ` class="${codeClass}"` : ""}>${esc(shown)}</code></pre>`;
        return `<details class="svc ${cls}"><summary>${summaryRaw}</summary><div class="content">${body}</div></details>`;
      }

      // Cap per-string values during serialization — avoids materializing megabytes
      // of JSON that truncSvc would throw away on the next line.
      // cut (optional): set cut.hit = true when anything was dropped, so the entry
      // can offer the full text.
      function stringifyBounded(v, cut = null) {
        try {
          return JSON.stringify(
            v,
            (_, val) => {
              if (typeof val !== "string" || val.length <= MAX_SVC) return val;
              if (cut) cut.hit = true;
              return val.slice(0, MAX_SVC) + "…";
            },
            2,
          );
        } catch (err) {
          // e.g. RangeError on absurdly deep nesting — this function backs every fallback
          return `[unserializable: ${err.message}]`;
        }
      }
      const jsonFull = (v) => {
        try {
          return JSON.stringify(v, null, 2);
        } catch (err) {
          return `[unserializable: ${err.message}]`;
        }
      };

      function joinBounded(items, cut = null) {
        const parts = [];
        let used = 0;
        for (let i = 0; i < items.length; i++) {
          const x = items[i];
          if (x == null) continue;
          const s = typeof x === "string" ? x : x.text || stringifyBounded(x, cut);
          parts.push(s);
          used += s.length + 1;
          if (used > MAX_SVC * 2) {
            if (cut && i < items.length - 1) cut.hit = true;
            break;
          }
        }
        return parts.join("\n");
      }

      // ===== full-text panel =====
      // marked v12 is roughly quadratic: ~0.7 s at 30k chars of code, minutes at 200k
      // on pathological input. Above this cap the panel offers plain text only.
      const MAX_PANEL_MD = 30_000;
      const panel = document.getElementById("full-panel");
      const fpTitle = document.getElementById("fp-title");
      const fpBody = document.getElementById("fp-body");
      const fpModes = panel.querySelectorAll("[data-mode]");
      const fpCopy = document.getElementById("fp-copy");
      const fpSave = document.getElementById("fp-save");
      const fpClose = document.getElementById("fp-close");
      let panelState = null; // { text, rec, mode, opener }

      function openPanel(entryEl, opener) {
        const full = entryEl && fullTexts.get(entryEl);
        if (!full) return;
        const who = entryEl.querySelector(".hdr .who")?.textContent ?? "";
        const tag = entryEl.querySelector(".hdr .tag")?.textContent ?? "";
        panelState = { text: String(full() ?? ""), rec: recOf.get(entryEl), mode: "text", opener, who };
        fpTitle.textContent = [who, tag].filter(Boolean).join(" · ");
        renderPanel();
        panel.showModal();
      }

      const panelText = () => (panelState.mode === "json" ? jsonFull(panelState.rec ?? null) : panelState.text);

      function renderPanel() {
        const tooBig = panelState.text.length > MAX_PANEL_MD;
        for (const b of fpModes) b.setAttribute("aria-pressed", String(b.dataset.mode === panelState.mode));
        const mdBtn = panel.querySelector('[data-mode="md"]');
        mdBtn.disabled = tooBig;
        mdBtn.title = tooBig ? L().mdTooBig : "";
        panel.querySelector('[data-mode="json"]').disabled = panelState.rec === undefined;
        if (panelState.mode === "md") {
          fpBody.innerHTML = `<div class="prose">${md(panelState.text)}</div>`;
        } else {
          const pre = document.createElement("pre");
          pre.textContent = panelText();
          fpBody.replaceChildren(pre);
        }
        fpBody.scrollTop = 0;
      }

      function renderPanelLabels() {
        const labels = { text: L().modeText, md: L().modeMd, json: L().modeJson };
        for (const b of fpModes) b.textContent = labels[b.dataset.mode];
        fpCopy.textContent = L().copyAll;
        fpSave.textContent = L().saveFile;
        fpClose.textContent = L().close;
      }

      for (const b of fpModes)
        b.addEventListener("click", () => {
          panelState.mode = b.dataset.mode;
          renderPanel();
        });
      fpCopy.addEventListener("click", async () => {
        if (!(await copyToClipboard(panelText()))) return;
        fpCopy.textContent = "✓ " + L().copied;
        setTimeout(() => (fpCopy.textContent = L().copyAll), 1200);
      });
      fpSave.addEventListener("click", () => {
        const ext = { text: "txt", md: "md", json: "json" }[panelState.mode];
        const base = `${state.fname.replace(/\.jsonl?$/i, "") || "transcript"}-${panelState.who}`;
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([panelText()], { type: "text/plain;charset=utf-8" }));
        a.download = `${base.replace(/[^\w.-]+/g, "_")}.${ext}`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });
      fpClose.addEventListener("click", () => panel.close());
      // A click on the backdrop lands on the <dialog> itself (its content fills the box).
      panel.addEventListener("click", (e) => {
        if (e.target === panel) panel.close();
      });
      panel.addEventListener("close", () => {
        fpBody.replaceChildren(); // drop a possibly huge DOM right away
        panelState?.opener?.focus();
        panelState = null;
      });

      function applyFilters() {
        for (const k of FILTERS) chatEl.classList.toggle("hide-" + k, !fbox[k].checked);
      }

      // Demo loader — only makes sense when the page is served over HTTP(S). On
      // file:// fetch() is blocked by browsers for security; we hide the button
      // rather than showing it and failing on click.
      const canLoadDemo = /^https?:$/.test(window.location.protocol);

      async function loadDemo() {
        statsEl.textContent = "";
        chatEl.innerHTML = `<div class="empty">${L().reading}</div>`;
        try {
          const res = await fetch("demo.jsonl");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          const tri = newTriage();
          for (const ln of text.split("\n")) triageLine(tri, ln);
          render(tri.rows, "demo.jsonl", tri);
        } catch (err) {
          chatEl.innerHTML = `<div class="empty">${L().errRead} ${esc(err.message)}</div>`;
        }
      }

      function renderEmptyState() {
        const demoBtn = canLoadDemo
          ? `<br><br><button type="button" id="demo-btn" class="demo-btn">▶ ${esc(L().tryExample)}</button>`
          : "";
        emptyEl.innerHTML =
          `${L().pick} <span class="kbd">.jsonl</span> ${L().transcriptHint} ` +
          `<i>${L().dropHint}</i>.<br>` +
          `${L().usuallyAt} <code>~/.claude/projects/&lt;project&gt;/&lt;session-uuid&gt;.jsonl</code>` +
          demoBtn;
        const btn = document.getElementById("demo-btn");
        if (btn) btn.addEventListener("click", loadDemo);
      }

      function renderFilterLabels() {
        const labels = L().filter;
        for (const span of document.querySelectorAll(".f-label")) {
          const k = span.dataset.k;
          const local = labels[k];
          const base = FILTER_BASENAMES[k];
          // Skip "(basename)" suffix when it would just repeat the translated label.
          span.textContent =
            local.toLowerCase() === base.toLowerCase() ? local : `${local} (${base})`;
        }
        readerLabel.textContent = L().readerMode;
      }

      // ===== init & live language/theme switching =====
      langSel.value = locale;
      langSel.addEventListener("change", () => {
        locale = langSel.value;
        storage.set("lang", locale);
        applyLocale();
        renderFilterLabels();
        renderPanelLabels();
        if (state.fname) render(state.rows, state.fname, state.tri);
        else renderEmptyState();
      });

      themeBtn.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        storage.set("theme", next);
        applyTheme(next);
      });

      applyLocale();
      applyTheme(preferredTheme());
      // Track OS theme changes live, but only while the user hasn't made a manual choice.
      window.matchMedia?.("(prefers-color-scheme: light)").addEventListener("change", (e) => {
        if (!storage.get("theme")) applyTheme(e.matches ? "light" : "dark");
      });
      const savedReader = storage.get("readerMode") === "1";
      readerBox.checked = savedReader;
      chatEl.classList.toggle("reader-mode", savedReader);
      renderFilterLabels();
      renderPanelLabels();
      renderEmptyState();
    </script>
  </body>
</html>
