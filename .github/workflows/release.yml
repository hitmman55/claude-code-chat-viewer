name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check syntax and run tests
        run: |
          node scripts/check-syntax.mjs
          node --test test/*.test.mjs

      - name: Build single-file HTML
        run: node scripts/build-single.mjs "$GITHUB_REF_NAME"

      - name: Release notes from CHANGELOG
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > dist/notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/claude-code-chat-viewer-*.html
          body_path: dist/notes.md
          generate_release_notes: true
